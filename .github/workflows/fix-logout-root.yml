name: Fix logout root

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch root and logout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/app.tsx')
          s = p.read_text()
          old = "function RootEntry(){const[checking,setChecking]=useState(true);const[user,setUser]=useState<User|null>(null);useEffect(()=>{void api('/api/v1/auth/me').then(x=>setUser(x.user||null)).catch(()=>setUser(null)).finally(()=>setChecking(false))},[]);if(checking)return <div className=\"auth-page\"><div className=\"auth-card\"><h1>CowboyBepob</h1><p>جارٍ التحقق من الاتصال والجلسة...</p></div></div>;return user?<div className=\"auth-page\"><div className=\"auth-card\"><div className=\"brand-inline\"><div className=\"brand-mark\"><Globe2 size={20}/></div><b>CowboyBepob</b></div><h1>مرحبًا بعودتك</h1><p>أنت مسجل الدخول بالفعل.</p><div className=\"alert success\">الحساب: {user.email}</div><a className=\"primary-button full\" href={user.type==='STAFF'?'/admin':'/customer'}>{user.type==='STAFF'?'فتح لوحة الإدارة':'فتح بوابة العميل'}</a></div></div>:<Auth onLogin={u=>{window.location.assign(u.type==='STAFF'?'/admin':'/customer')}}/>}"
          new = "function RootEntry(){return <Auth onLogin={u=>{window.location.assign(u.type==='STAFF'?'/admin':'/customer')}}/>}"
          if old not in s:
              raise SystemExit('RootEntry pattern not found')
          s = s.replace(old, new, 1)
          old2 = "const logout=async()=>{setChecking(true);try{await api('/api/v1/auth/logout',{method:'POST'})}catch(e:any){console.error('logout failed',e)}finally{setUser(null);setChecking(false);window.location.replace('/')}}"
          new2 = "const logout=async()=>{setChecking(true);try{await fetch('/api/v1/auth/logout',{method:'POST',credentials:'include',headers:{'content-type':'application/json','cache-control':'no-cache'},cache:'no-store',keepalive:true})}catch(e:any){console.error('logout failed',e)}finally{document.cookie='cb_csrf=; Max-Age=0; Path=/';setUser(null);setChecking(false);window.location.replace('/')}}"
          if old2 not in s:
              raise SystemExit('logout pattern not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-logout-root.yml
          git add apps/web/src/app.tsx .github/workflows/fix-logout-root.yml
          git commit -m "fix: logout returns to public login [logout-root-fix]"
          git push origin main
