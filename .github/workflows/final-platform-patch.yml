name: Final platform patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')

          # Database
          schema=root/'db/schema.sql'; s=schema.read_text()
          if 'provisioning_mode text NOT NULL DEFAULT' not in s:
            s=s.replace("label text,status text NOT NULL DEFAULT 'PROVISIONING',suspend_reason text,origin_order_item_id uuid UNIQUE,created_at", "label text,status text NOT NULL DEFAULT 'PROVISIONING',provisioning_mode text NOT NULL DEFAULT 'MANAGED' CHECK(provisioning_mode IN('MANAGED','MANUAL')),suspend_reason text,origin_order_item_id uuid UNIQUE,created_at")
          if 'manual_link_enc bytea' not in s:
            s=s.replace("credential_key_id text NOT NULL,params jsonb NOT NULL DEFAULT '{}',created_at", "credential_key_id text NOT NULL,params jsonb NOT NULL DEFAULT '{}',manual_link_enc bytea,created_at")
          schema.write_text(s)
          mig=root/'db/migrations/003_manual_services.sql'
          if not mig.exists(): mig.write_text("""ALTER TABLE services ADD COLUMN IF NOT EXISTS provisioning_mode text NOT NULL DEFAULT 'MANAGED';\nALTER TABLE configs ADD COLUMN IF NOT EXISTS manual_link_enc bytea;\nDO $$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_constraint WHERE conname='services_provisioning_mode_check') THEN ALTER TABLE services ADD CONSTRAINT services_provisioning_mode_check CHECK (provisioning_mode IN ('MANAGED','MANUAL')); END IF; END $$;\nCREATE INDEX IF NOT EXISTS services_provisioning_mode_idx ON services(provisioning_mode);\n""")

          # API
          api=root/'apps/api/src/main.ts'; a=api.read_text()
          if 'function parseManualClientLink' not in a:
            marker="function errorStatus(e: any) { return Number(e?.statusCode) || 500; }"
            helper="""function parseManualClientLink(raw: string) {\n  const link=String(raw||'').trim();\n  if(!link) throw Object.assign(new Error('رابط الكونفيج مطلوب'),{statusCode:400});\n  if(link.startsWith('vless://')){ let u:URL; try{u=new URL(link)}catch{throw Object.assign(new Error('رابط VLESS غير صالح'),{statusCode:400})}; const uuid=decodeURIComponent(u.username||''); const port=Number(u.port); if(!uuid||!u.hostname||!Number.isInteger(port)||port<1||port>65535) throw Object.assign(new Error('رابط VLESS غير مكتمل'),{statusCode:400}); const params:any={}; for(const k of ['type','security','sni','host','path','flow','fp','alpn','serviceName']) if(u.searchParams.get(k)) params[k]=u.searchParams.get(k); return {protocol:'vless',uuid,address:u.hostname,port,transport:params.type||'tcp',security:params.security||'none',params}; }\n  if(link.startsWith('vmess://')){ try{ const enc=link.slice(8).replace(/-/g,'+').replace(/_/g,'/'); const pad=enc+'='.repeat((4-enc.length%4)%4); const o=JSON.parse(Buffer.from(pad,'base64').toString('utf8')); const uuid=String(o.id||o.uuid||''),address=String(o.add||o.address||''),port=Number(o.port); if(!uuid||!address||!Number.isInteger(port)||port<1||port>65535) throw new Error('bad'); const params:any={}; for(const k of ['host','path','sni','flow','fp','alpn','serviceName']) if(o[k]) params[k]=o[k]; return {protocol:'vmess',uuid,address,port,transport:String(o.net||'tcp'),security:o.tls?'tls':'none',params}; }catch{throw Object.assign(new Error('رابط VMess غير صالح'),{statusCode:400})} }\n  throw Object.assign(new Error('الرابط يجب أن يبدأ بـ vless:// أو vmess://'),{statusCode:400});\n}\n"""
            a=a.replace(marker,marker+'\n'+helper)
          # services listing
          a=a.replace("SELECT s.id,s.public_code,s.label,s.status,s.created_at,c.name category,c.protocol,sub.status subscription_status,sub.current_period_end,sub.starts_at,sub.used_bytes,sub.quota_bytes,cu.public_code customer_code,cu.full_name customer_name,h.city,h.country,se.public_code endpoint_code FROM services s", "SELECT s.id,s.public_code,s.label,s.status,s.provisioning_mode,s.created_at,c.name category,c.protocol,sub.status subscription_status,sub.current_period_end,sub.starts_at,sub.used_bytes,sub.quota_bytes,cu.public_code customer_code,cu.full_name customer_name,r.public_code router_code,h.city,h.country,se.public_code endpoint_code FROM services s")
          if "admin.post('/services/manual'" not in a:
            marker="  admin.post('/services/:id/action', async (req:any) => {"
            route="""  admin.post('/services/manual', async (req:any) => {\n    requirePermission(req,'services:write'); requireCsrf(req); const b=req.body||{}; const customerId=String(b.customerId||''),planId=String(b.planId||''),routerId=b.routerId?String(b.routerId):null; if(!customerId||!planId||!b.link) throw Object.assign(new Error('العميل والخطة والرابط مطلوبة'),{statusCode:400});\n    const cr=await db(`SELECT id FROM customers WHERE id=$1 AND status<>'DELETED'`,[customerId]); if(!cr.rowCount) throw Object.assign(new Error('العميل غير موجود'),{statusCode:404});\n    const pr=await db(`SELECT p.*,c.id category_id,c.protocol,c.name category_name FROM config_plans p JOIN config_categories c ON c.id=p.category_id WHERE p.id=$1 AND p.status='ACTIVE'`,[planId]); if(!pr.rowCount) throw Object.assign(new Error('الخطة غير موجودة أو غير نشطة'),{statusCode:400}); const p=pr.rows[0], parsed=parseManualClientLink(String(b.link));\n    if(parsed.protocol!==p.protocol) throw Object.assign(new Error(`الرابط ${parsed.protocol.toUpperCase()} لا يطابق بروتوكول الخطة ${p.protocol.toUpperCase()}`),{statusCode:400});\n    if(routerId){const rr=await db(`SELECT id,customer_id,lifecycle_status FROM routers WHERE id=$1`,[routerId]); if(!rr.rowCount) throw Object.assign(new Error('الراوتر غير موجود'),{statusCode:404}); if(rr.rows[0].customer_id&&rr.rows[0].customer_id!==customerId) throw Object.assign(new Error('الراوتر مرتبط بعميل آخر'),{statusCode:409}); if(['DECOMMISSIONED','REPLACED'].includes(rr.rows[0].lifecycle_status)) throw Object.assign(new Error('الراوتر غير صالح للربط'),{statusCode:400}); const live=await db(`SELECT id FROM services WHERE router_id=$1 AND status IN('PROVISIONING','ACTIVE','SUSPENDED')`,[routerId]); if(live.rowCount) throw Object.assign(new Error('الراوتر مرتبط بخدمة أخرى بالفعل'),{statusCode:409}); if(!rr.rows[0].customer_id) await db(`UPDATE routers SET customer_id=$1,lifecycle_status='ASSIGNED',updated_at=now() WHERE id=$2`,[customerId,routerId]);}\n    const c=await pool.connect(); try{await c.query('BEGIN'); const svc=(await c.query(`INSERT INTO services(customer_id,category_id,plan_id,router_id,label,status,provisioning_mode) VALUES($1,$2,$3,$4,$5,'ACTIVE','MANUAL') RETURNING id,public_code`,[customerId,p.category_id,p.id,routerId,String(b.label||'').trim()||p.category_name+' - '+p.name])).rows[0]; const end=new Date(Date.now()+Number(p.duration_days)*86400000); const sub=(await c.query(`INSERT INTO subscriptions(service_id,plan_id,status,starts_at,current_period_end,quota_bytes) VALUES($1,$2,'ACTIVE',now(),$3,$4) RETURNING id`,[svc.id,p.id,end,p.quota_bytes])).rows[0]; await c.query(`INSERT INTO configs(service_id,version,status,protocol,transport,security,client_credential_enc,credential_key_id,params,manual_link_enc) VALUES($1,1,'CURRENT',$2,$3,$4,$5,'env-v1',$6,$7)`,[svc.id,parsed.protocol,parsed.transport,parsed.security,encryptSecret(parsed.uuid),JSON.stringify({...parsed.params,address:parsed.address,port:parsed.port}),encryptSecret(String(b.link).trim())]); await audit(c,req,'service.manual_created','services',svc.id,{mode:'MANUAL',protocol:parsed.protocol,routerId},customerId); await c.query('COMMIT'); return {id:svc.id,public_code:svc.public_code,subscriptionId:sub.id}; }catch(e){await c.query('ROLLBACK');throw e}finally{c.release()}\n  });\n"""
            a=a.replace(marker,route+marker)
          # router customer assignment
          if 'customer_id,lifecycle_status) VALUES($1,$2,$3,$4,$5,$6,$7' not in a:
            a=a.replace("INSERT INTO routers(serial_number,device_identifier,model,hardware_revision,openwrt_version,firmware_version,lifecycle_status) VALUES($1,$2,$3,$4,$5,$6,'IN_STOCK') RETURNING *", "INSERT INTO routers(serial_number,device_identifier,model,hardware_revision,openwrt_version,firmware_version,customer_id,lifecycle_status) VALUES($1,$2,$3,$4,$5,$6,$7,CASE WHEN $7 IS NULL THEN 'IN_STOCK' ELSE 'ASSIGNED' END) RETURNING *")
            a=a.replace("[b.serialNumber,b.deviceIdentifier||null,b.model,b.hardwareRevision||null,b.openwrtVersion||null,b.firmwareVersion||null])).rows[0]; });", "[b.serialNumber,b.deviceIdentifier||null,b.model,b.hardwareRevision||null,b.openwptVersion||null,b.firmwareVersion||null,b.customerId||null])).rows[0]; });".replace('openwptVersion','openwrtVersion'),1)
          # customer config route
          pat=r"customer\.get\('/services/:id/config', async \(req:any\) => \{.*?\n  \}\);"
          repl="""customer.get('/services/:id/config', async (req:any) => {\n    const r=await db(`SELECT s.id,s.router_id,c.link_visibility,cfg.protocol,cfg.transport,cfg.security,cfg.client_credential_enc,cfg.params,cfg.manual_link_enc FROM services s JOIN config_categories c ON c.id=s.category_id JOIN configs cfg ON cfg.service_id=s.id AND cfg.status='CURRENT' WHERE s.id=$1 AND s.customer_id=$2`,[req.params.id,req.principal!.id]); if(!r.rowCount) throw Object.assign(new Error('Config غير متاح'),{statusCode:404}); const row=r.rows[0]; if(row.link_visibility==='NEVER'||(row.link_visibility==='STANDALONE_ONLY'&&row.router_id)) throw Object.assign(new Error('الرابط غير متاح لهذه الخدمة'),{statusCode:403}); let link=''; if(row.manual_link_enc) link=decryptSecret(row.manual_link_enc); else {const alloc=await db(`SELECT e.port,h.address FROM service_allocations a JOIN server_endpoints e ON e.id=a.endpoint_id JOIN hosts h ON h.id=e.host_id WHERE a.service_id=$1 AND a.status='ACTIVE'`,[req.params.id]); if(!alloc.rowCount) throw Object.assign(new Error('Config غير متاح'),{statusCode:404}); const uuid=decryptSecret(row.client_credential_enc),address=alloc.rows[0].address,port=alloc.rows[0].port; if(row.protocol==='vless'){const q=new URLSearchParams();if(row.transport)q.set('type',row.transport);if(row.security)q.set('security',row.security);for(const k of ['sni','path','host','flow'])if(row.params?.[k])q.set(k,row.params[k]);link=`vless://${encodeURIComponent(uuid)}@${address}:${port}?${q.toString()}#CowboyBebop`;}else{const payload=Buffer.from(JSON.stringify({v:2,ps:'CowboyBebop',add:address,port:String(port),id:uuid,aid:0,net:row.transport||'tcp',type:'none',host:row.params?.host||'',path:row.params?.path||'',tls:row.security==='tls'?'tls':''})).toString('base64');link=`vmess://${payload}`;}} const c=await pool.connect();try{await audit(c,req,'secret.revealed','configs',null,{serviceId:req.params.id},req.principal!.id)}finally{c.release()} return {link};\n  });"""
          a,n=re.subn(pat,repl,a,count=1,flags=re.S)
          if n!=1: raise SystemExit('config route patch failed')
          api.write_text(a)

          # Worker manual mode + DB provider credentials.
          wfile=root/'apps/api/src/worker.ts'; w=wfile.read_text()
          if 's.provisioning_mode' not in w:
            w=w.replace("SELECT s.id,s.public_code,s.status,p.duration_days", "SELECT s.id,s.public_code,s.status,s.provisioning_mode,p.duration_days")
            w=w.replace("FROM services s JOIN config_plans p", "FROM services s JOIN config_plans p",1)
          w=w.replace("if(!row||row.status==='TERMINATED')return;", "if(!row||row.status==='TERMINATED')return;if(row.provisioning_mode==='MANUAL')return;",1)
          w=w.replace("const provider=new MarzbanProvider(row.base_url,process.env.MARZBAN_USERNAME||'',process.env.MARZBAN_PASSWORD||'');", "if(!row.base_url||!row.credentials_enc) throw new Error('MARZBAN_PROVIDER_CREDENTIALS_MISSING'); const creds=JSON.parse(decrypt(row.credentials_enc)); const provider=new MarzbanProvider(row.base_url,creds.username,creds.password);",1)
          # Renew: manual services only extend subscription.
          if 's.provisioning_mode' not in w[w.find('async function renewService'):w.find('async function serviceAction')]:
            w=w.replace("SELECT oi.id,oi.target_service_id,p.duration_days", "SELECT oi.id,oi.target_service_id,s.provisioning_mode,p.duration_days",1)
            w=w.replace("FROM order_items oi JOIN config_plans p", "FROM order_items oi JOIN services s ON s.id=oi.target_service_id JOIN config_plans p",1)
          w=w.replace("await new MarzbanProvider(base.base_url,process.env.MARZBAN_USERNAME||'',process.env.MARZBAN_PASSWORD||'').createOrUpdate({username:base.external_username,uuid:decrypt(base.client_credential_enc),inbound:base.provider_inbound_tag,expireAt:end,quotaBytes:base.quota_bytes,protocol:base.protocol,flow:base.params?.flow});", "if(base.provisioning_mode!=='MANUAL'){if(!base.base_url||!base.credentials_enc) throw new Error('MARZBAN_PROVIDER_CREDENTIALS_MISSING');const creds=JSON.parse(decrypt(base.credentials_enc));await new MarzbanProvider(base.base_url,creds.username,creds.password).createOrUpdate({username:base.external_username,uuid:decrypt(base.client_credential_enc),inbound:base.provider_inbound_tag,expireAt:end,quotaBytes:base.quota_bytes,protocol:base.protocol,flow:base.params?.flow});}",1)
          wfile.write_text(w)

          # New admin tools page; keeps the large existing app component stable.
          tools=root/'apps/web/src/admin-tools.tsx'
          tools.write_text(r'''import React,{FormEvent,useEffect,useState}from'react';\nimport{Plus,RefreshCw}from'lucide-react';\nconst api=async(path:string,init:RequestInit={})=>{const h=new Headers(init.headers);h.set('content-type','application/json');const csrf=document.cookie.split('; ').find(x=>x.startsWith('cb_csrf='))?.split('=')[1];if(csrf&&init.method&&init.method!=='GET')h.set('x-csrf-token',csrf);const r=await fetch(path,{...init,headers:h,credentials:'include'});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d};\nconst money=(v:any)=>`${(Number(v||0)/100).toLocaleString('ar-EG',{maximumFractionDigits:2})} EGP`;\nfunction Field({label,value,onChange,type='text',required=true}:{label:string;value:any;onChange:(v:string)=>void;type?:string;required?:boolean}){return <label>{label}<input value={value} onChange={e=>onChange(e.target.value)} type={type} required={required}/></label>}\nexport function ManualServicePage(){const[v,setV]=useState<any>({});const[cust,setCust]=useState<any[]>([]);const[cat,setCat]=useState<any>({plans:[]});const[routers,setRouters]=useState<any[]>([]);const[error,setError]=useState('');const[ok,setOk]=useState('');const load=()=>void Promise.all([api('/api/v1/admin/customers'),api('/api/v1/admin/catalog'),api('/api/v1/admin/routers')]).then(([c,k,r])=>{setCust(c);setCat(k);setRouters(r)}).catch(e=>setError(e.message));useEffect(load,[]);const plans=(cat.plans||[]).filter((p:any)=>p.status==='ACTIVE');const rs=routers.filter(r=>(!r.customer_id||r.customer_id===v.customerId)&&!['DECOMMISSIONED','REPLACED'].includes(r.lifecycle_status));const save=async(e:FormEvent)=>{e.preventDefault();setError('');setOk('');try{const x=await api('/api/v1/admin/services/manual',{method:'POST',body:JSON.stringify(v)});setOk(`تم إنشاء ${x.public_code} وتفعيل الاشتراك. الرابط سيظهر للعميل فورًا.`);setV({});}catch(e:any){setError(e.message)}};return <div className="page"><div className="page-heading"><div><div className="eyebrow">CowboyBepob</div><h1>إضافة خدمة يدوية</h1><p>أدخل VLESS أو VMess جاهزًا. الراوتر اختياري؛ بدون راوتر تصبح الخدمة Standalone.</p></div></div><section className="panel manual-form"><form onSubmit={save}><label>العميل<select value={v.customerId||''} onChange={e=>setV({...v,customerId:e.target.value,routerId:''})} required><option value="">اختر العميل</option>{cust.map(c=><option key={c.id} value={c.id}>{c.full_name} · {c.public_code}</option>)}</select></label><label>الخطة<select value={v.planId||''} onChange={e=>setV({...v,planId:e.target.value})} required><option value="">اختر الخطة</option>{plans.map(p=><option key={p.id} value={p.id}>{p.category_name} · {p.name} · {p.protocol} · {money(p.price_minor)}</option>)}</select></label><label>الراوتر <span className="muted-note">(اختياري)</span><select value={v.routerId||''} onChange={e=>setV({...v,routerId:e.target.value||null})}><option value="">Standalone — بدون راوتر</option>{rs.map(r=><option key={r.id} value={r.id}>{r.public_code} · {r.model} · {r.customer_name||'غير مرتبط'}</option>)}</select></label><Field label="اسم الخدمة" value={v.label||''} onChange={x=>setV({...v,label:x})} required={false}/><label>رابط VLESS / VMess<textarea value={v.link||''} onChange={e=>setV({...v,link:e.target.value})} placeholder="vless://... أو vmess://..." required/></label>{error&&<div className="alert error">{error}</div>}{ok&&<div className="alert success">{ok}</div>}<div className="toolbar"><button className="primary-button" type="submit"><Plus size={15}/> إنشاء وتفعيل</button><button className="secondary-button" type="button" onClick={load}><RefreshCw size={15}/> تحديث القوائم</button></div></form></section></div>}\nexport function CatalogManagePage(){const[d,setD]=useState<any>({categories:[],plans:[],routerProducts:[]});const[mode,setMode]=useState('category');const[v,setV]=useState<any>({protocol:'vless',status:'ACTIVE',durationDays:30});const[error,setError]=useState('');const load=()=>void api('/api/v1/admin/catalog').then(setD).catch(e=>setError(e.message));useEffect(load,[]);const save=async(e:FormEvent)=>{e.preventDefault();setError('');try{if(mode==='category')await api('/api/v1/admin/catalog/categories',{method:'POST',body:JSON.stringify({name:v.name,slug:v.slug,description:v.description,protocol:v.protocol,routerCompatible:true,status:v.status})});if(mode==='plan')await api('/api/v1/admin/catalog/plans',{method:'POST',body:JSON.stringify({categoryId:v.categoryId,name:v.name,durationDays:Number(v.durationDays),priceMinor:Math.round(Number(v.price)*100),currency:'EGP',quotaBytes:v.quotaGb?Math.round(Number(v.quotaGb)*1024*1024*1024):null})});if(mode==='router')await api('/api/v1/admin/catalog/router-products',{method:'POST',body:JSON.stringify({sku:v.sku,name:v.name,model:v.model,priceMinor:Math.round(Number(v.price)*100),currency:'EGP'})});setV({protocol:'vless',status:'ACTIVE',durationDays:30});load()}catch(e:any){setError(e.message)}};return <div className="page"><div className="page-heading"><div><div className="eyebrow">CowboyBepob</div><h1>إدارة الكتالوج</h1><p>إنشاء الفئات والخطط ومنتجات الراوتر.</p></div></div><section className="panel"><div className="tabs tool-tabs"><button type="button" className={mode==='category'?'active':''} onClick={()=>setMode('category')}>فئة</button><button type="button" className={mode==='plan'?'active':''} onClick={()=>setMode('plan')}>خطة</button><button type="button" className={mode==='router'?'active':''} onClick={()=>setMode('router')}>منتج راوتر</button></div><form onSubmit={save}>{mode==='category'&&<><Field label="اسم الفئة" value={v.name||''} onChange={x=>setV({...v,name:x})}/><Field label="Slug" value={v.slug||''} onChange={x=>setV({...v,slug:x})}/><Field label="الوصف" value={v.description||''} onChange={x=>setV({...v,description:x})} required={false}/><label>البروتوكول<select value={v.protocol} onChange={e=>setV({...v,protocol:e.target.value})}><option value="vless">VLESS</option><option value="vmess">VMess</option></select></label><label>الحالة<select value={v.status} onChange={e=>setV({...v,status:e.target.value})}><option value="ACTIVE">نشط</option><option value="DRAFT">مسودة</option><option value="INACTIVE">غير نشط</option></select></label></>}{mode==='plan'&&<><label>الفئة<select value={v.categoryId||''} onChange={e=>setV({...v,categoryId:e.target.value})} required><option value="">اختر الفئة</option>{d.categories.map((c:any)=><option key={c.id} value={c.id}>{c.name} · {c.protocol}</option>)}</select></label><Field label="اسم الخطة" value={v.name||''} onChange={x=>setV({...v,name:x})}/><Field label="المدة بالأيام" value={v.durationDays} onChange={x=>setV({...v,durationDays:x})}/><Field label="السعر بالجنيه" value={v.price||''} onChange={x=>setV({...v,price:x})}/><Field label="الحصة GB" value={v.quotaGb||''} onChange={x=>setV({...v,quotaGb:x})} required={false}/></>}{mode==='router'&&<><Field label="SKU" value={v.sku||''} onChange={x=>setV({...v,sku:x})}/><Field label="الاسم" value={v.name||''} onChange={x=>setV({...v,name:x})}/><Field label="الموديل" value={v.model||''} onChange={x=>setV({...v,model:x})}/><Field label="السعر بالجنيه" value={v.price||''} onChange={x=>setV({...v,price:x})}/></>}{error&&<div className="alert error">{error}</div>}<button className="primary-button full">حفظ</button></form></section><section className="panel"><h2>الحالي</h2>{mode==='category'&&d.categories.map((x:any)=><div className="list-row" key={x.id}><b>{x.name}</b><span className="badge">{x.protocol} · {x.status}</span></div>)}{mode==='plan'&&d.plans.map((x:any)=><div className="list-row" key={x.id}><b>{x.name}</b><span>{x.category_name} · {money(x.price_minor)}</span></div>)}{mode==='router'&&d.routerProducts.map((x:any)=><div className="list-row" key={x.id}><b>{x.name}</b><span>{x.sku} · {money(x.price_minor)}</span></div>)}</section></div>}\n''')

          # Import and routes in app.tsx.
          app=root/'apps/web/src/app.tsx'; x=app.read_text()
          if "from './admin-tools'" not in x: x=x.replace("import'./styles.css';", "import'./styles.css';\nimport{ManualServicePage,CatalogManagePage}from'./admin-tools';")
          if "path=\"/admin/services/manual\"" not in x: x=x.replace("<Route path=\"/admin/settings\" element={<SettingsPage/>}/>", "<Route path=\"/admin/settings\" element={<SettingsPage/>}/><Route path=\"/admin/services/manual\" element={<ManualServicePage/>}/><Route path=\"/admin/catalog/manage\" element={<CatalogManagePage/>}/>")
          app.write_text(x)

          css=root/'apps/web/src/styles.css'; c=css.read_text(); c += "\n.manual-form{max-width:760px}.manual-form form{display:flex;flex-direction:column;gap:14px}.manual-form label{font-size:9px;color:#657187;font-weight:800}.manual-form input,.manual-form select,.manual-form textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none;font-size:10px;background:#fff}.manual-form input,.manual-form select{height:42px}.manual-form textarea{min-height:150px;resize:vertical;direction:ltr;text-align:left}.manual-form input:focus,.manual-form select:focus,.manual-form textarea:focus{border-color:#9fb5ec;box-shadow:0 0 0 3px #4f7df012}.muted-note{color:#9aa5b7;font-weight:500}.tool-tabs{justify-content:flex-start;gap:6px}.tool-tabs button{padding:8px 14px}\n"; css.write_text(c)
          print('done')
