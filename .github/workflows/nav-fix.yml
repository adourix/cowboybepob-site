name: Navigation fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/web/src/app.tsx'); s=p.read_text()
          old="const nav=[['/admin','نظرة عامة',LayoutDashboard],"
          new="const nav=[['/admin','نظرة عامة',LayoutDashboard],['/admin/services/manual','إضافة خدمة',Plus],['/admin/catalog/manage','إدارة الكتالوج',Package],"
          if old not in s: raise SystemExit('nav marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/app.tsx
          git commit -m "fix: expose manual service and catalog admin pages [skip ci]"
          git push origin main
