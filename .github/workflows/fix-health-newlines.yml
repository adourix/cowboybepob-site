name: Repair health check source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair literal newline escapes
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/api/src/main.ts')
          s = p.read_text()
          start = s.index("import { MarzbanProvider } from './marzban.js';")
          end = s.index("const app = Fastify", start)
          block = s[start:end]
          block = block.replace('\\\\n', '\\n')
          p.write_text(s[:start] + block + s[end:])
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-health-newlines.yml
          git add apps/api/src/main.ts .github/workflows/fix-health-newlines.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair health check source formatting"
          git push
