name: Apply admin fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          api=Path('apps/api/src/main.ts'); s=api.read_text()
          old="app.post('/api/v1/auth/logout', async (req: Req, reply) => { requireCsrf(req);"; new="app.post('/api/v1/auth/logout', async (req: Req, reply) => {"
          if old in s: s=s.replace(old,new,1)
          marker="  admin.get('/orders', async (req:Req) =>"
          endpoint="  admin.get('/subscriptions', async (req:Req) => { requirePermission(req,'services:read'); return (await db(`SELECT sub.id, s.public_code, cu.full_name customer_name, c.name category, sub.status subscription_status, sub.starts_at, sub.current_period_end, sub.used_bytes, sub.quota_bytes FROM subscriptions sub JOIN services s ON s.id=sub.service_id JOIN customers cu ON cu.id=s.customer_id JOIN config_categories c ON c.id=s.category_id ORDER BY sub.current_period_end DESC NULLS LAST LIMIT 300`)).rows; });\n"
          if "admin.get('/subscriptions'" not in s and marker in s: s=s.replace(marker,endpoint+marker,1)
          api.write_text(s)
          web=Path('apps/web/src/app.tsx'); w=web.read_text()
          w=w.replace("subscriptions:{title:'الاشتراكات',endpoint:'/api/v1/admin/services',","subscriptions:{title:'الاشتراكات',endpoint:'/api/v1/admin/subscriptions',",1)
          w=w.replace("useEffect(()=>{void load()},[]);const add=kind==='customers'||kind==='routers'||kind==='servers';","useEffect(()=>{void load();const id=window.setInterval(()=>void load(),15000);return()=>window.clearInterval(id)},[q]);const add=kind==='customers'||kind==='routers'||kind==='servers';",1)
          w=w.replace("useEffect(load,[]);return <div className=\"page\"><Heading title=\"الكتالوج\"","useEffect(()=>{load();const id=window.setInterval(load,15000);return()=>window.clearInterval(id)},[]);return <div className=\"page\"><Heading title=\"الكتالوج\"",1)
          w=w.replace("const logout=async()=>{try{await api('/api/v1/auth/logout',{method:'POST'})}catch{}setUser(null);window.location.assign('/')} ","const logout=async()=>{setUser(null);try{await api('/api/v1/auth/logout',{method:'POST'})}catch{}window.location.replace('/')} ")
          old_top="<div className=\"user-label\"><b>{user.fullName}</b><span>{user.role==='SUPER_ADMIN'?'مدير النظام':user.role||'موظف'}</span></div></div></header>"
          new_top="<div className=\"user-label\"><b>{user.fullName}</b><span>{user.role==='SUPER_ADMIN'?'مدير النظام':user.role||'موظف'}</span></div><button className=\"logout-button\" type=\"button\" onClick={onLogout}><LogOut size={15}/> تسجيل الخروج</button></div></header>"
          if old_top in w: w=w.replace(old_top,new_top,1)
          web.write_text(w)
          css=Path('apps/web/src/styles.css'); c=css.read_text()
          if '.logout-button{' not in c: c+='\n.logout-button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:700;font-size:12px}.logout-button:hover{background:#f6f8fb}\n'
          css.write_text(c)
          PY
      - name: Verify
        run: |
          npm install
          npm run typecheck
          npm test
          npm run build
      - name: Commit changes and remove temp workflows
        run: |
          rm -f .github/workflows/inspect-ui.yml .github/workflows/fix-admin-sync.yml .github/workflows/apply-admin-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/main.ts apps/web/src/app.tsx apps/web/src/styles.css .github/workflows/inspect-ui.yml .github/workflows/fix-admin-sync.yml .github/workflows/apply-admin-fix.yml
          git commit -m 'fix: sync admin data and logout [admin-sync-fix]'
          git push origin HEAD:main
