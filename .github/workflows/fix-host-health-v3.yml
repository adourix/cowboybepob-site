name: Finalize host health repair
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          main = Path('apps/api/src/main.ts')
          text = main.read_text()
          marker = "import { MarzbanProvider } from './marzban.js';"
          start = text.find(marker)
          end = text.find('\nconst app =', start)
          if start >= 0 and end > start:
              text = text[:start] + text[start:end].replace('\\n', '\n') + text[end:]
          main.write_text(text)

          web = Path('apps/web/src/app.tsx')
          w = web.read_text()
          fs = w.find('function ServerForm')
          if fs >= 0:
              fe = w.find('\nfunction ', fs + 1)
              if fe < 0:
                  fe = len(w)
              form = w[fs:fe]
              form = form.replace('label="العنوان"', 'label="العنوان (IP / hostname فقط)"', 1)
              w = w[:fs] + form + w[fe:]
          web.write_text(w)
          PY
          git diff --check

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/main.ts apps/web/src/app.tsx
          git rm -f .github/workflows/fix-host-health.yml .github/workflows/fix-host-health-v2.yml .github/workflows/fix-host-health-v3.yml
          git commit -m "fix: repair Marzban health monitor and host address label"
          git push