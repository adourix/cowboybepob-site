name: Payment confirmation fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch payment confirmation flow
        run: |
          python scripts/payment_confirmation_fix.py
          python scripts/payment_ui_fix.py
      - name: Verify
        run: |
          npm install --include=dev
          npm run typecheck
          npm run build
      - name: Commit and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/payment_confirmation_fix.py scripts/payment_ui_fix.py .github/workflows/payment-confirmation-fix.yml
          git add apps/api/src/main.ts apps/web/src/main.tsx apps/web/src/styles.css scripts/payment_confirmation_fix.py scripts/payment_ui_fix.py .github/workflows/payment-confirmation-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add admin payment confirmation and rejection"
          git push
