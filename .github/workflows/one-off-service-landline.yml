name: One-off service landline column
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add landline number to services table
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/src/app.tsx')
          s = p.read_text(encoding='utf-8')
          old = "services:{title:'الخدمات',endpoint:'/api/v1/admin/services',cols:['الكود','العميل','الفئة','البروتوكول','الحالة','الكونفيج'],keys:['public_code','customer_name','category','protocol','status','config_code']}"
          new = "services:{title:'الخدمات',endpoint:'/api/v1/admin/services',cols:['الكود','العميل','الفئة','البروتوكول','الحالة','الرقم الأرضي','الكونفيج'],keys:['public_code','customer_name','category','protocol','status','landline_number','config_code']}"
          if old not in s:
              raise SystemExit('current services metadata not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit and remove one-off workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/app.tsx
          git rm .github/workflows/one-off-service-landline.yml
          git commit -m 'fix: show landline number in services table'
          git push
