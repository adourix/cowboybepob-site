name: Inspect UI

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[inspect-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('apps/web/src/app.tsx').read_text()
          for marker in ['function ResourcePage','function CatalogPage','function App(){','function Shell(']:
              i=s.find(marker)
              print('\n===== '+marker+' =====')
              print(s[i:i+8000] if i>=0 else 'NOT FOUND')
          PY
