name: Fix empty JSON request headers

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch request headers
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/src/app.tsx')
          s = p.read_text()
          old = "const method=String(init.method||'GET').toUpperCase();const h=new Headers(init.headers);h.set('content-type','application/json');const csrf=getCsrfCookie();"
          new = "const method=String(init.method||'GET').toUpperCase();const h=new Headers(init.headers);if(init.body!=null)h.set('content-type','application/json');const csrf=getCsrfCookie();"
          if old not in s:
              raise SystemExit('expected api header code not found')
          p.write_text(s.replace(old,new,1))
      - name: Clean up and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-json-body.yml
          git add apps/web/src/app.tsx .github/workflows/fix-json-body.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: avoid empty json content type requests"
          git push