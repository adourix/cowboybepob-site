name: One-shot platform repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: python3 scripts/fix-patch-script.py
      - run: python3 scripts/final-platform-patch.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit platform patch
        run: |
          rm -f scripts/final-platform-patch.py scripts/fix-patch-script.py PATCH_TRIGGER.txt PATCH_TRIGGER_2.txt package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/schema.sql db/migrations/003_manual_services.sql apps/api/src/main.ts apps/api/src/worker.ts apps/web/src/app.tsx apps/web/src/admin-tools.tsx apps/web/src/styles.css
          git commit -m "feat: add manual services and optional router binding [skip ci]"
          git push origin main
