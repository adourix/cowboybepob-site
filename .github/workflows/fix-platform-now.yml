name: One-shot platform repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: python3 scripts/fix-patch-script.py
      - run: python3 scripts/final-platform-patch.py
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit and clean
        run: |
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI
          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]
          jobs:
            build:
              runs-on: ubuntu-latest
              services:
                postgres:
                  image: postgres:16
                  env:
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_USER: postgres
                    POSTGRES_DB: cowboybepob
                  ports: ['5432:5432']
                  options: >-
                    --health-cmd="pg_isready -U postgres -d cowboybepob"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=20
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 22
                - run: npm install
                - run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d cowboybepob -f db/schema.sql
                - run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d cowboybepob -f db/migrations/001_provider_credentials.sql
                - run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d cowboybepob -f db/migrations/002_email_verification.sql
                - run: npm test
                - name: Typecheck
                  id: typecheck
                  shell: bash
                  env:
                    DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cowboybepob
                    ENCRYPTION_KEY: ci-test-encryption-key
                    NODE_ENV: test
                  run: |
                    set +e
                    npm run typecheck 2>&1 | tee typecheck.log
                    status=${PIPESTATUS[0]}
                    exit "$status"
                - name: Upload typecheck log
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: typecheck-log
                    path: typecheck.log
                - run: npm run build
          EOF
          rm -f scripts/final-platform-patch.py scripts/fix-patch-script.py PATCH_TRIGGER.txt .github/workflows/apply-platform-fix.yml .github/workflows/trigger-platform-fix.yml .github/workflows/run-platform-patch.yml .github/workflows/final-platform-patch.yml .github/workflows/fix-platform-now.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add manual services and optional router binding [skip ci]"
          git push origin main
