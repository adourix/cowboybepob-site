name: Apply router config assignment v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-router-config-assignment-v2.mjs'
      - '.github/workflows/apply-router-config-assignment-v2.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Apply source patch
        run: node scripts/apply-router-config-assignment-v2.mjs
      - name: Build and test
        run: |
          npm install
          npm run build
          npm test
      - name: Remove one-time patch machinery
        run: rm -f scripts/apply-router-config-assignment.mjs scripts/apply-router-config-assignment-v2.mjs .github/workflows/apply-router-config-assignment.yml .github/workflows/apply-router-config-assignment-v2.yml
      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ github.token }}
          branch: feature/router-config-assignment
          delete-branch: true
          title: 'feat: link routers to customer configs'
          commit-message: 'feat: link routers to customer configs'
          body: |
            Implements router registration with explicit customer + existing config selection.

            - validates customer/config ownership and service state
            - links the existing service to the new router
            - exposes config/service codes in admin and customer data
            - shows the selected config in router registration and customer service cards
            - builds and runs architecture tests before creating this PR
