name: Fix Server Delete UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-server-delete-ui.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch actual servers page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('apps/web/src/app.tsx')
          s = p.read_text()

          pattern = r"function ResourcePage\(\{kind\}:\{kind:Kind\}\)\{.*?\}\nfunction CustomerForm"
          m = re.search(pattern, s, re.S)
          if not m:
              raise SystemExit('ResourcePage block not found')

          new = r'''function ResourcePage({kind}:{kind:Kind}){const m=meta[kind];const[rows,setRows]=useState<any[]>([]);const[q,setQ]=useState('');const[open,setOpen]=useState(false);const[error,setError]=useState('');const[busy,setBusy]=useState(false);const load=async()=>{setBusy(true);setError('');try{const x=await api(m.endpoint+(q&&kind!=='subscriptions'?`?q=${encodeURIComponent(q)}`:''));let list=Array.isArray(x)?x:[];if(kind==='subscriptions')list=list.filter((r:any)=>r.subscription_status);if(q)list=list.filter((r:any)=>JSON.stringify(r).toLowerCase().includes(q.toLowerCase()));setRows(list)}catch(e:any){setError(e.message)}finally{setBusy(false)}};useEffect(()=>{void load();const id=window.setInterval(()=>void load(),15000);return()=>window.clearInterval(id)},[q]);const add=kind==='customers'||kind==='routers'||kind==='servers';const remove=async(id:string,name:string)=>{if(!window.confirm(`حذف الخادم «${name}»؟`))return;try{await api(`/api/v1/admin/servers/hosts/${id}`,{method:'DELETE'});await load()}catch(e:any){setError(e.message)}};return <div className="page"><Heading title={m.title} sub="بيانات حقيقية من الـAPI." onAdd={add?()=>setOpen(true):undefined} addText={kind==='customers'?'إضافة عميل':kind==='routers'?'تسجيل راوتر':'إضافة خادم'}/><section className="panel table-panel"><div className="toolbar"><label className="search wide"><Search size={16}/><input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&load()} placeholder="بحث..."/></label><button className="secondary-button" type="button" onClick={()=>void load()} disabled={busy}><RefreshCw size={15}/> تحديث</button></div>{error&&<div className="alert error">{error}</div>}<div className="table-wrap"><table><thead><tr>{m.cols.map(x=><th key={x}>{x}</th>)}{kind==='servers'&&<th>إجراءات</th>}</tr></thead><tbody>{rows.length===0?<tr><td className="empty" colSpan={m.cols.length+(kind==='servers'?1:0)}>{busy?'جارٍ التحميل...':'لا توجد بيانات'}</td></tr>:rows.map((r,i)=><tr key={r.id||i}>{m.keys.map(k=><td key={k}>{k==='email_verified_at'?(r[k]?'مؤكد':'غير مؤكد'):k.includes('minor')?money(r[k]):k==='used_bytes'?formatBytes(r[k]):k.endsWith('_at')||['starts_at','current_period_end','last_seen_at','created_at'].includes(k)?date(r[k]):['status','connectivity','state','lifecycle_status','subscription_status','health_status'].includes(k)?<span className="badge">{label(r[k])}</span>:String(r[k]??'—')}</td>)}{kind==='servers'&&<td><button className="danger-button" type="button" onClick={()=>remove(r.id,r.name||r.address||'هذا الخادم')}>حذف</button></td>}</tr>)}</tbody></table></div></section>{open&&kind==='customers'&&<CustomerForm onClose={()=>setOpen(false)} onDone={()=>{setOpen(false);void load()}}/>}{open&&kind==='routers'&&<RouterForm onClose={()=>setOpen(false)} onDone={()=>{setOpen(false);void load()}}/>}{open&&kind==='servers'&&<ServerForm onClose={()=>setOpen(false)} onDone={()=>{setOpen(false);void load()}}/>}</div>}
function CustomerForm'''

          s = s[:m.start()] + new + s[m.end():]
          p.write_text(s)
          PY

      - name: Verify build
        run: |
          npm install --include=dev
          npm run build

      - name: Commit source and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-server-delete-ui.yml
          git add apps/web/src/app.tsx .github/workflows/fix-server-delete-ui.yml
          git commit -m 'fix: add delete action to servers page'
          git push
