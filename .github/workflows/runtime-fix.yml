name: Runtime fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patch runtime queries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          api=Path('apps/api/src/main.ts'); a=api.read_text()
          a=a.replace("LEFT JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN service_allocations sa ON sa.service_id=s.id AND sa.status='ACTIVE'", "LEFT JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN routers r ON r.id=s.router_id LEFT JOIN service_allocations sa ON sa.service_id=s.id AND sa.status='ACTIVE'", 1)
          api.write_text(a)
          wfile=Path('apps/api/src/worker.ts'); w=wfile.read_text()
          w=w.replace("pi.base_url FROM services s JOIN config_plans", "pi.base_url,pi.credentials_enc FROM services s JOIN config_plans", 1)
          w=w.replace("pa.external_username,pi.base_url,cfg.protocol", "pa.external_username,pi.base_url,pi.credentials_enc,cfg.protocol", 1)
          old="const row=(await pool.query(`SELECT s.id,s.status,pa.external_username,pi.base_url FROM services s JOIN proxy_accounts pa ON pa.service_id=s.id AND pa.status='ACTIVE' JOIN provider_instances pi ON pi.id=pa.provider_instance_id WHERE s.id=$1`,[job.subject_id])).rows[0];if(!row)return;const provider=new MarzbanProvider(row.base_url,process.env.MARZBAN_USERNAME||'',process.env.MARZBAN_PASSWORD||'');"
          new="const row=(await pool.query(`SELECT s.id,s.status,s.provisioning_mode,pa.external_username,pi.base_url,pi.credentials_enc FROM services s LEFT JOIN proxy_accounts pa ON pa.service_id=s.id AND pa.status='ACTIVE' LEFT JOIN provider_instances pi ON pi.id=pa.provider_instance_id WHERE s.id=$1`,[job.subject_id])).rows[0];if(!row)return;if(row.provisioning_mode==='MANUAL')return;if(!row.base_url||!row.credentials_enc||!row.external_username)throw new Error('MARZBAN_PROVIDER_CREDENTIALS_MISSING');const creds=JSON.parse(decrypt(row.credentials_enc));const provider=new MarzbanProvider(row.base_url,creds.username,creds.password);"
          if old not in w: raise SystemExit('serviceAction pattern not found')
          w=w.replace(old,new,1)
          w=w.replace("SELECT pa.external_username,pi.base_url FROM proxy_accounts pa", "SELECT pa.external_username,pi.base_url,pi.credentials_enc FROM proxy_accounts pa", 1)
          w=w.replace("new MarzbanProvider(r.base_url,process.env.MARZBAN_USERNAME||'',process.env.MARZBAN_PASSWORD||'').disable(r.external_username)", "new MarzbanProvider(r.base_url,JSON.parse(decrypt(r.credentials_enc)).username,JSON.parse(decrypt(r.credentials_enc)).password).disable(r.external_username)")
          wfile.write_text(w)
          PY
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/main.ts apps/api/src/worker.ts
          git commit -m "fix: use router joins and provider credentials from database [skip ci]"
          git push origin main
