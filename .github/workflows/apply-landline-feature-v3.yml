name: Apply landline feature v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[landline-v3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source changes
        run: |
          cat > /tmp/landline-v3.mjs <<'NODE'
          import fs from 'node:fs';
          const root=process.cwd();
          const api=`${root}/apps/api/src/main.ts`, worker=`${root}/apps/api/src/worker-v2.ts`, web=`${root}/apps/web/src/app.tsx`, schema=`${root}/db/schema.sql`;
          const replace=(file,a,b,label)=>{const s=fs.readFileSync(file,'utf8');if(!s.includes(a))throw new Error('missing '+label);fs.writeFileSync(file,s.replace(a,b));};
          replace(api,"function parseManualClientLink(raw: string) {",`function normalizeLandline(raw: string) { let value=String(raw||'').trim().replace(/[\\s().-]/g,''); if(value.startsWith('+20')) value=value.slice(3); else if(value.startsWith('20')) value=value.slice(2); if(!value.startsWith('0')) value='0'+value; if(!/^0[0-9]{8,10}$/.test(value)) throw Object.assign(new Error('رقم أرضي غير صالح. استخدم رقمًا مصريًا مثل 0225551111.'),{statusCode:400}); return value; }
          function parseManualClientLink(raw: string) {`,'normalize helper');
          replace(api,"  customer.patch('/profile', async (req:any) => { requireCsrf(req);const b=req.body||{};return (await db('UPDATE customers SET full_name=COALESCE($1,full_name),mobile_phone=COALESCE($2,mobile_phone),address_line=COALESCE($3,address_line),city=COALESCE($4,city),governorate=COALESCE($5,governorate),updated_at=now() WHERE id=$6 RETURNING id,public_code,full_name,email,mobile_phone,address_line,city,governorate,status,email_verified_at',[b.fullName,b.mobilePhone,b.addressLine,b.city,b.governorate,req.principal!.id])).rows[0]; });",`  customer.patch('/profile', async (req:any) => { requireCsrf(req);const b=req.body||{};return (await db('UPDATE customers SET full_name=COALESCE($1,full_name),mobile_phone=COALESCE($2,mobile_phone),address_line=COALESCE($3,address_line),city=COALESCE($4,city),governorate=COALESCE($5,governorate),updated_at=now() WHERE id=$6 RETURNING id,public_code,full_name,email,mobile_phone,address_line,city,governorate,status,email_verified_at',[b.fullName,b.mobilePhone,b.addressLine,b.city,b.governorate,req.principal!.id])).rows[0]; });
            customer.get('/landlines', async (req:Req) => (await db('SELECT id,number,label,created_at FROM customer_landlines WHERE customer_id=$1 ORDER BY created_at ASC',[req.principal!.id])).rows);
            customer.post('/landlines', async (req:any) => { requireCsrf(req); const number=normalizeLandline(req.body?.number); const label=String(req.body?.label||'').trim().slice(0,80)||null; try{return (await db('INSERT INTO customer_landlines(customer_id,number,label) VALUES($1,$2,$3) RETURNING id,number,label,created_at',[req.principal!.id,number,label])).rows[0]}catch(e:any){if(e?.code==='23505')throw Object.assign(new Error('هذا الرقم مضاف بالفعل إلى حسابك.'),{statusCode:409});throw e;} });
            customer.delete('/landlines/:id', async (req:any) => { requireCsrf(req); const d=await db("SELECT (SELECT count(*) FROM services WHERE landline_id=$1 AND status IN ('PROVISIONING','ACTIVE','SUSPENDED'))::int active_services,(SELECT count(*) FROM order_items WHERE landline_id=$1 AND fulfillment_status IN ('PENDING','IN_PROGRESS','NEEDS_ATTENTION'))::int pending_orders",[req.params.id]); if(!d.rowCount)throw Object.assign(new Error('رقم غير موجود'),{statusCode:404}); if(Number(d.rows[0].active_services)>0||Number(d.rows[0].pending_orders)>0)throw Object.assign(new Error('لا يمكن حذف الرقم لأنه مرتبط بخدمة أو طلب جارٍ.'),{statusCode:409}); const r=await db('DELETE FROM customer_landlines WHERE id=$1 AND customer_id=$2 RETURNING id',[req.params.id,req.principal!.id]); if(!r.rowCount)throw Object.assign(new Error('رقم غير موجود'),{statusCode:404}); return {ok:true}; });`,'customer landline routes');
          replace(api,"const p=await c.query(`SELECT p.*,c.name category_name FROM config_plans p JOIN config_categories c ON c.id=p.category_id WHERE p.id=$1 AND p.status='ACTIVE'`,[item.planId]);if(!p.rowCount)throw Object.assign(new Error('Plan not found'),{statusCode:400});subtotal+=Number(p.rows[0].price_minor);resolved.push({type:'CONFIG_NEW',planId:item.planId,name:p.rows[0].category_name+' - '+p.rows[0].name,price:Number(p.rows[0].price_minor),useWithRouter:Boolean(item.useWithRouter)});","const p=await c.query(`SELECT p.*,c.name category_name FROM config_plans p JOIN config_categories c ON c.id=p.category_id WHERE p.id=$1 AND p.status='ACTIVE'`,[item.planId]);if(!p.rowCount)throw Object.assign(new Error('Plan not found'),{statusCode:400});const lr=await c.query('SELECT id FROM customer_landlines WHERE id=$1 AND customer_id=$2',[item.landlineId,req.principal!.id]);if(!lr.rowCount)throw Object.assign(new Error('يجب اختيار رقم أرضي من أرقامك.'),{statusCode:400});subtotal+=Number(p.rows[0].price_minor);resolved.push({type:'CONFIG_NEW',planId:item.planId,landlineId:item.landlineId,name:p.rows[0].category_name+' - '+p.rows[0].name,price:Number(p.rows[0].price_minor),useWithRouter:Boolean(item.useWithRouter)});",'order validation');
          replace(api,"for(const item of resolved)await c.query(`INSERT INTO order_items(order_id,item_type,router_product_id,plan_id,use_with_router,name_snapshot,unit_price_minor) VALUES($1,$2,$3,$4,$5,$6,$7)`,[o.rows[0].id,item.type,item.routerProductId||null,item.planId||null,item.useWithRouter||false,item.name,item.price]);","for(const item of resolved)await c.query(`INSERT INTO order_items(order_id,item_type,router_product_id,plan_id,landline_id,use_with_router,name_snapshot,unit_price_minor) VALUES($1,$2,$3,$4,$5,$6,$7,$8)`,[o.rows[0].id,item.type,item.routerProductId||null,item.planId||null,item.landlineId||null,item.useWithRouter||false,item.name,item.price]);",'order item');
          replace(api,"SELECT s.id,s.public_code,s.label,c.name category_name,s.status,sub.status subscription_status,sub.starts_at,sub.current_period_end,sub.used_bytes,sub.quota_bytes,r.public_code router_code,r.model router_model,r.connectivity router_connectivity,cfg.public_code config_code,h.city,h.country FROM services s","SELECT s.id,s.public_code,s.label,c.name category_name,s.status,sub.status subscription_status,sub.starts_at,sub.current_period_end,sub.used_bytes,sub.quota_bytes,cl.number landline_number,cl.label landline_label,r.public_code router_code,r.model router_model,r.connectivity router_connectivity,cfg.public_code config_code,h.city,h.country FROM services s",'customer services select');
          replace(api,"LEFT JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN routers r ON r.id=s.router_id","LEFT JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN customer_landlines cl ON cl.id=s.landline_id LEFT JOIN routers r ON r.id=s.router_id",'customer service join');
          replace(api,"LEFT JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN routers r ON r.id=s.router_id LEFT JOIN configs cfg","LEFT JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN customer_landlines cl ON cl.id=s.landline_id LEFT JOIN routers r ON r.id=s.router_id LEFT JOIN configs cfg",'customer detail join');
          replace(api,"admin.get('/customers', async (req:any) => { requirePermission(req,'customers:read'); const q=String(req.query?.q||''); return (await db(`SELECT id,public_code,full_name,email,mobile_phone,city,status,email_verified_at,created_at FROM customers WHERE status<>'DELETED' AND ($1='' OR full_name ILIKE '%'||$1||'%' OR email ILIKE '%'||$1||'%' OR public_code ILIKE '%'||$1||'%') ORDER BY created_at DESC LIMIT 100`,[q])).rows; });","admin.get('/customers', async (req:any) => { requirePermission(req,'customers:read'); const q=String(req.query?.q||''); return (await db(`SELECT c.id,c.public_code,c.full_name,c.email,c.mobile_phone,c.city,c.status,c.email_verified_at,c.created_at,COALESCE(string_agg(cl.number,'، ' ORDER BY cl.created_at),'') landlines FROM customers c LEFT JOIN customer_landlines cl ON cl.customer_id=c.id WHERE c.status<>'DELETED' AND ($1='' OR c.full_name ILIKE '%'||$1||'%' OR c.email ILIKE '%'||$1||'%' OR c.public_code ILIKE '%'||$1||'%') GROUP BY c.id ORDER BY c.created_at DESC LIMIT 100`,[q])).rows; });",'admin customers');
          replace(api,"r.public_code router_code,cfg.id config_id,cfg.public_code config_code,h.city,h.country,se.public_code endpoint_code","r.public_code router_code,cl.number landline_number,cl.label landline_label,cfg.id config_id,cfg.public_code config_code,h.city,h.country,se.public_code endpoint_code",'admin services select');
          replace(api,"LEFT JOIN configs cfg ON cfg.service_id=s.id AND cfg.status='CURRENT' LEFT JOIN service_allocations a","LEFT JOIN configs cfg ON cfg.service_id=s.id AND cfg.status='CURRENT' LEFT JOIN customer_landlines cl ON cl.id=s.landline_id LEFT JOIN service_allocations a",'admin services join');
          replace(worker,"INSERT INTO services(customer_id,category_id,plan_id,router_id,label,status,origin_order_item_id) VALUES($1,$2,$3,$4,$5,'PROVISIONING',$6) RETURNING id,public_code`,[item.customer_id,p.category_id,p.id,item.use_with_router?purchasedRouterId:null,item.name_snapshot,item.id]","INSERT INTO services(customer_id,category_id,plan_id,landline_id,router_id,label,status,origin_order_item_id) VALUES($1,$2,$3,$4,$5,$6,'PROVISIONING',$7) RETURNING id,public_code`,[item.customer_id,p.category_id,p.id,item.landline_id||null,item.use_with_router?purchasedRouterId:null,item.name_snapshot,item.id]",'worker service');
          replace(schema,"CREATE TABLE IF NOT EXISTS customer_landlines(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),customer_id uuid NOT NULL REFERENCES customers(id) ON DELETE CASCADE,number text NOT NULL,label text,created_at timestamptz NOT NULL DEFAULT now(),UNIQUE(customer_id,number));","CREATE TABLE IF NOT EXISTS customer_landlines(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),customer_id uuid NOT NULL REFERENCES customers(id) ON DELETE CASCADE,number text NOT NULL CHECK(number~'^0[0-9]{8,10}$'),label text,created_at timestamptz NOT NULL DEFAULT now(),UNIQUE(customer_id,number));",'schema landline');
          replace(schema,"CREATE TABLE IF NOT EXISTS services(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),public_code text UNIQUE NOT NULL DEFAULT('SV-'||lpad(nextval('service_code_seq')::text,6,'0')),customer_id uuid NOT NULL REFERENCES customers(id),category_id uuid NOT NULL REFERENCES config_categories(id),plan_id uuid REFERENCES config_plans(id),router_id uuid REFERENCES routers(id),label text,status","CREATE TABLE IF NOT EXISTS services(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),public_code text UNIQUE NOT NULL DEFAULT('SV-'||lpad(nextval('service_code_seq')::text,6,'0')),customer_id uuid NOT NULL REFERENCES customers(id),category_id uuid NOT NULL REFERENCES config_categories(id),plan_id uuid REFERENCES config_plans(id),landline_id uuid REFERENCES customer_landlines(id),router_id uuid REFERENCES routers(id),label text,status",'schema services');
          replace(schema,"CREATE TABLE IF NOT EXISTS order_items(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),order_id uuid NOT NULL REFERENCES orders(id),item_type text NOT NULL,router_product_id uuid REFERENCES router_products(id),plan_id uuid REFERENCES config_plans(id),target_service_id","CREATE TABLE IF NOT EXISTS order_items(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),order_id uuid NOT NULL REFERENCES orders(id),item_type text NOT NULL,router_product_id uuid REFERENCES router_products(id),plan_id uuid REFERENCES config_plans(id),landline_id uuid REFERENCES customer_landlines(id),target_service_id",'schema order items');
          replace(web,"function CustomerPortal({user,onLogout}:{user:User;onLogout:()=>void}){const [cats,setCats]=useState<any[]>([]);const [services,setServices]=useState<any[]>([]);const [orders,setOrders]=useState<any[]>([]);const [msg,setMsg]=useState('');","function CustomerPortal({user,onLogout}:{user:User;onLogout:()=>void}){const [cats,setCats]=useState<any[]>([]);const [services,setServices]=useState<any[]>([]);const [orders,setOrders]=useState<any[]>([]);const [landlines,setLandlines]=useState<any[]>([]);const [selectedLandline,setSelectedLandline]=useState('');const [landlineNumber,setLandlineNumber]=useState('');const [landlineLabel,setLandlineLabel]=useState('');const [msg,setMsg]=useState('');",'web states');
          replace(web,"const load=()=>{api('/api/v1/customer/catalog/categories').then(setCats);api('/api/v1/customer/services').then(setServices);api('/api/v1/customer/orders').then(setOrders)};","const load=()=>{api('/api/v1/customer/catalog/categories').then(setCats);api('/api/v1/customer/services').then(setServices);api('/api/v1/customer/orders').then(setOrders);api('/api/v1/customer/landlines').then((x:any[])=>{setLandlines(x);if(!selectedLandline&&x[0]?.id)setSelectedLandline(x[0].id)})};const addLandline=async(e:FormEvent)=>{e.preventDefault();try{await api('/api/v1/customer/landlines',{method:'POST',body:JSON.stringify({number:landlineNumber,label:landlineLabel})});setLandlineNumber('');setLandlineLabel('');setMsg('تمت إضافة الرقم الأرضي.');load()}catch(e:any){setMsg(e.message)}};const removeLandline=async(id:string)=>{if(!confirm('حذف الرقم؟'))return;try{await api('/api/v1/customer/landlines/'+id,{method:'DELETE'});if(selectedLandline===id)setSelectedLandline('');load()}catch(e:any){setMsg(e.message)}};",'web load');
          replace(web,"body:JSON.stringify({items:[{type:'CONFIG_NEW',planId}]})","body:JSON.stringify({items:[{type:'CONFIG_NEW',planId,landlineId:selectedLandline}]})",'web order payload');
          replace(web,"const order=async(planId:string)=>{try{","const order=async(planId:string)=>{if(!selectedLandline){setMsg('اختر رقمًا أرضيًا أولًا.');return}try{",'web order guard');
          replace(web,"<section className=\"panel\"><div className=\"panel-head\"><h2>الباقات المتاحة</h2></div>","<section className=\"panel\"><div className=\"panel-head\"><h2>أرقامي الأرضية</h2></div><form className=\"toolbar\" onSubmit={addLandline}><input value={landlineNumber} onChange={e=>setLandlineNumber(e.target.value)} placeholder=\"مثال: 0225551111\" inputMode=\"tel\" required/><input value={landlineLabel} onChange={e=>setLandlineLabel(e.target.value)} placeholder=\"اسم اختياري\"/><button className=\"primary-button\">إضافة رقم</button></form><div className=\"list-card\">{landlines.map((l:any)=><div className=\"list-row\" key={l.id}><span><b>{l.number}</b> {l.label||''}</span><button className=\"danger-button\" type=\"button\" onClick={()=>removeLandline(l.id)}>حذف</button></div>)}</div><label>رقم الكونفيج الجديد<select value={selectedLandline} onChange={e=>setSelectedLandline(e.target.value)}><option value=\"\">اختر رقمًا</option>{landlines.map((l:any)=><option key={l.id} value={l.id}>{l.number}{l.label?' · '+l.label:''}</option>)}</select></label></section><section className=\"panel\"><div className=\"panel-head\"><h2>الباقات المتاحة</h2></div>",'web landline ui');
          replace(web,"<button className=\"primary-button\" onClick={()=>order(p.id)}>اطلب الآن</button>","<button className=\"primary-button\" disabled={!selectedLandline} onClick={()=>order(p.id)}>اطلب الآن</button>",'web order button');
          replace(web,"async function api(path:string,init:RequestInit={}){const h=new Headers(init.headers);h.set('content-type','application/json');","async function api(path:string,init:RequestInit={}){const h=new Headers(init.headers);if(init.body!=null)h.set('content-type','application/json');",'web api delete');
          fs.writeFileSync(`${root}/db/migrations/20261018_customer_landlines.sql`,`BEGIN;\nCREATE TABLE IF NOT EXISTS customer_landlines(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),customer_id uuid NOT NULL REFERENCES customers(id) ON DELETE CASCADE,number text NOT NULL,label text,created_at timestamptz NOT NULL DEFAULT now(),UNIQUE(customer_id,number));\nUPDATE customer_landlines SET number=regexp_replace(regexp_replace(regexp_replace(trim(number),'[[:space:]().-]+','','g'),'^\\+20',''),' ^20','') WHERE number IS NOT NULL;\nUPDATE customer_landlines SET number='0'||number WHERE number !~ '^0' AND number ~ '^[0-9]+$';\nALTER TABLE customer_landlines DROP CONSTRAINT IF EXISTS customer_landlines_number_format_ck;\nALTER TABLE customer_landlines ADD CONSTRAINT customer_landlines_number_format_ck CHECK(number~'^0[0-9]{8,10}$');\nALTER TABLE services ADD COLUMN IF NOT EXISTS landline_id uuid REFERENCES customer_landlines(id);\nALTER TABLE order_items ADD COLUMN IF NOT EXISTS landline_id uuid REFERENCES customer_landlines(id);\nCREATE INDEX IF NOT EXISTS customer_landlines_customer_idx ON customer_landlines(customer_id,created_at);\nCREATE INDEX IF NOT EXISTS services_landline_idx ON services(landline_id);\nCREATE INDEX IF NOT EXISTS order_items_landline_idx ON order_items(landline_id);\nCOMMIT;\n`);
          console.log('v3 complete');
          NODE
          node /tmp/landline-v3.mjs
      - name: Validate
        run: |
          git diff --check
          npm install --ignore-scripts
          npm run typecheck
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-landline-feature.yml .github/workflows/apply-landline-feature-v2.yml .github/workflows/apply-landline-feature-v3.yml
          git add apps/api/src/main.ts apps/api/src/worker-v2.ts apps/web/src/app.tsx db/schema.sql db/migrations/20261018_customer_landlines.sql .github/workflows/apply-landline-feature.yml .github/workflows/apply-landline-feature-v2.yml .github/workflows/apply-landline-feature-v3.yml
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "feat: support customer landline numbers for config orders"
          git push origin main
