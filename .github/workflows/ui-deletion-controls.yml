name: Add UI deletion controls

on:
  push:
    paths:
      - .github/workflows/ui-deletion-controls.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch admin UI
        env:
          PROVIDER_LIST_ENDPOINT: /api/v1/admin/provider-instances
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/web/src/main.tsx')
          text = path.read_text(encoding='utf-8')

          if 'function ProvidersPage(' not in text:
              marker = 'function CustomerForm('
              if marker not in text:
                  raise SystemExit('CustomerForm marker not found')

              pages = r'''function ProvidersPage(){
                const [rows,setRows]=useState<any[]>([]);
                const [error,setError]=useState('');
                const [loading,setLoading]=useState(false);
                const load=()=>{setLoading(true);api('/api/v1/admin/provider-instances').then(x=>setRows(Array.isArray(x)?x:(Array.isArray(x?.providers)?x.providers:[]))).catch(e=>setError(e.message)).finally(()=>setLoading(false));};
                useEffect(()=>{void load();},[]);
                const remove=async(id:string,name:string)=>{if(!window.confirm(`حذف المزوّد «${name}»؟`))return;setError('');try{await api(`/api/v1/admin/provider-instances/${id}`,{method:'DELETE'});await load();}catch(e:any){setError(e.message)}};
                return <div className="page"><Heading title="المزوّدون" sub="إدارة مزوّدي Marzban وحذف المزوّد غير المستخدم."/><section className="panel table-panel"><div className="toolbar"><button className="secondary-button" onClick={load}><RefreshCw size={15}/> تحديث</button></div>{error&&<div className="alert error">{error}</div>}<div className="table-wrap"><table><thead><tr><th>الاسم</th><th>Base URL</th><th>الحالة</th><th>بيانات الدخول</th><th>آخر نجاح</th><th>إجراءات</th></tr></thead><tbody>{loading?<tr><td className="empty" colSpan={6}>جاري التحميل...</td></tr>:rows.length===0?<tr><td className="empty" colSpan={6}>لا توجد مزوّدات</td></tr>:rows.map((r:any)=><tr key={r.id}><td>{r.name||'—'}</td><td className="code">{r.base_url||r.baseUrl||'—'}</td><td><span className="badge">{label(r.status)}</span></td><td>{r.has_credentials?'موجودة':'غير موجودة'}</td><td>{date(r.last_ok_at)}</td><td><button className="danger-button" onClick={()=>remove(r.id,r.name||'هذا المزوّد')}><Trash2 size={15}/> حذف</button></td></tr>)}</tbody></table></div></section></div>;
              }

              function ConfigsPage(){
                const [rows,setRows]=useState<any[]>([]);
                const [error,setError]=useState('');
                const [loading,setLoading]=useState(false);
                const load=()=>{setLoading(true);api('/api/v1/admin/configs').then(x=>setRows(Array.isArray(x)?x:[])).catch(e=>setError(e.message)).finally(()=>setLoading(false));};
                useEffect(()=>{void load();},[]);
                const remove=async(id:string,code:string)=>{if(!window.confirm(`حذف الكونفيج «${code}»؟`))return;setError('');try{await api(`/api/v1/admin/configs/${id}`,{method:'DELETE'});await load();}catch(e:any){setError(e.message)}};
                return <div className="page"><Heading title="الكونفيجات" sub="عرض وإدارة الكونفيجات المحفوظة للخدمات."/><section className="panel table-panel"><div className="toolbar"><button className="secondary-button" onClick={load}><RefreshCw size={15}/> تحديث</button></div>{error&&<div className="alert error">{error}</div>}<div className="table-wrap"><table><thead><tr><th>الكود</th><th>الخدمة</th><th>حالة الخدمة</th><th>الإصدار</th><th>الحالة</th><th>البروتوكول</th><th>التاريخ</th><th>إجراءات</th></tr></thead><tbody>{loading?<tr><td className="empty" colSpan={8}>جاري التحميل...</td></tr>:rows.length===0?<tr><td className="empty" colSpan={8}>لا توجد كونفيجات</td></tr>:rows.map((r:any)=><tr key={r.id}><td>{r.public_code||'—'}</td><td>{r.service_code||r.service_public_code||r.service_id||'—'}</td><td><span className="badge">{label(r.service_status)}</span></td><td>{r.version??'—'}</td><td><span className="badge">{label(r.status)}</span></td><td>{r.protocol||'—'}</td><td>{date(r.created_at)}</td><td><button className="danger-button" onClick={()=>remove(r.id,r.public_code||r.id)}><Trash2 size={15}/> حذف</button></td></tr>)}</tbody></table></div></section></div>;
              }

              '''
              text = text.replace(marker, pages + marker, 1)

          # Replace the generic resource page with a version that has a real delete action for hosts.
          start = text.find('function ResourcePage(')
          end = text.find('function CustomerForm(', start)
          if start < 0 or end < 0:
              raise SystemExit('ResourcePage markers not found')

          replacement = r'''function ResourcePage({kind,user:_user}:{kind:ResourceKind;user:User}){const m=meta[kind];const [rows,setRows]=useState<any[]>([]);const [q,setQ]=useState('');const [open,setOpen]=useState(false);const [error,setError]=useState('');const [loading,setLoading]=useState(false);const load=()=>{setLoading(true);setError('');api(m.endpoint+(q?`?q=${encodeURIComponent(q)}`:'')).then(x=>setRows(Array.isArray(x)?x:[])).catch(e=>setError(e.message)).finally(()=>setLoading(false))};useEffect(()=>{void load();},[]);const canAdd=['customers','routers','servers'].includes(kind);const canDelete=kind==='servers';const remove=async(id:string,name:string)=>{if(!window.confirm(`حذف الخادم «${name}»؟`))return;setError('');try{await api(`/api/v1/admin/servers/hosts/${id}`,{method:'DELETE'});await load();}catch(e:any){setError(e.message)}};const cols=canDelete?[...m.cols,'إجراءات']:m.cols;return <div className="page"><Heading title={m.title} sub="بيانات حقيقية من الـAPI." onAdd={canAdd?()=>setOpen(true):undefined}/><section className="panel table-panel"><div className="toolbar"><label className="search wide"><Search size={16}/><input value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==='Enter'&&load()} placeholder="بحث..."/></label><button className="secondary-button" onClick={load}><RefreshCw size={15}/> تحديث</button></div>{error&&<div className="alert error">{error}</div>}<div className="table-wrap"><table><thead><tr>{cols.map((x:string)=><th key={x}>{x}</th>)}</tr></thead><tbody>{loading?<tr><td className="empty" colSpan={cols.length}>جاري التحميل...</td></tr>:rows.length===0?<tr><td className="empty" colSpan={cols.length}>لا توجد بيانات</td></tr>:rows.map((r:any,i:number)=><tr key={r.id||i}>{m.keys.map((k:string)=><td key={k}>{k.includes('minor')?money(r[k]):k.endsWith('_at')||k.includes('date')?date(r[k]):['status','connectivity','state','lifecycle_status','health_status'].includes(k)?<span className="badge">{label(r[k])}</span>:String(r[k]??'—')}</td>)}{canDelete&&<td><button className="danger-button" onClick={()=>remove(r.id,r.name||r.address||'هذا الخادم')}><Trash2 size={15}/> حذف</button></td>}</tr>)}</tbody></table></div></section>{open&&kind==='customers'&&<CustomerForm onClose={()=>setOpen(false)} onDone={()=>{setOpen(false);load()}}/>}{open&&kind==='routers'&&<RouterForm onClose={()=>setOpen(false)} onDone={()=>{setOpen(false);load()}}/>}{open&&kind==='servers'&&<ServerForm onClose={()=>setOpen(false)} onDone={()=>{setOpen(false);load()}}/>}</div>}
'''
          text = text[:start] + replacement + text[end:]

          # Add routes if they are not already present. The app uses a single Routes block.
          if 'path="/admin/providers"' not in text:
              routes = re.search(r'<Routes>(.*?)</Routes>', text, re.S)
              if not routes:
                  raise SystemExit('Routes block not found')
              block = routes.group(1)
              injection = '<Route path="/admin/providers" element={<ProvidersPage/>}/><Route path="/admin/configs" element={<ConfigsPage/>}/>'
              text = text[:routes.start(1)] + block + injection + text[routes.start(1)+len(block):]

          path.write_text(text, encoding='utf-8')
          print('UI deletion controls patched')
          PY

      - name: Install and build
        run: npm install --include=dev && npm run build

      - name: Commit changes and remove patch workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/main.tsx
          git rm .github/workflows/ui-deletion-controls.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: expose server provider and config deletion in admin UI"
          git push
