name: Implement router shipping lifecycle
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch router order lifecycle
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          main = Path('apps/api/src/main.ts'); s = main.read_text()
          old = "admin.get('/orders', async (req:Req) => { requirePermission(req,'orders:read'); return (await db(`SELECT o.*,c.public_code customer_code,c.full_name customer_name,(SELECT count(*) FROM order_items oi WHERE oi.order_id=o.id)::int item_count FROM orders o JOIN customers c ON c.id=o.customer_id ORDER BY o.created_at DESC LIMIT 200`)).rows; });"
          new = "admin.get('/orders', async (req:Req) => { requirePermission(req,'orders:read'); return (await db(`SELECT o.*,c.public_code customer_code,c.full_name customer_name,(SELECT count(*) FROM order_items oi WHERE oi.order_id=o.id)::int item_count,(SELECT bool_and(oi.item_type='ROUTER') FROM order_items oi WHERE oi.order_id=o.id) router_only FROM orders o JOIN customers c ON c.id=o.customer_id ORDER BY o.created_at DESC LIMIT 200`)).rows; });"
          if old not in s: raise SystemExit('orders GET marker not found')
          s=s.replace(old,new,1)
          marker="admin.post('/orders/:id/cancel', async (req:any) => { requirePermission(req,'orders:write');requireCsrf(req);return (await db(`UPDATE orders SET status='CANCELLED',cancelled_at=now(),updated_at=now() WHERE id=$1 AND status IN ('PENDING_PAYMENT','FULFILLING') RETURNING *`,[req.params.id])).rows[0]||null; });"
          if marker not in s: raise SystemExit('orders cancel marker not found')
          routes=r'''admin.post('/orders/:id/ship', async (req:any) => {
    requirePermission(req,'orders:write'); requireCsrf(req);
    const c=await pool.connect();
    try { await c.query('BEGIN');
      const order=(await c.query(`SELECT id,public_code,customer_id,status FROM orders WHERE id=$1 FOR UPDATE`,[req.params.id])).rows[0];
      if(!order) throw Object.assign(new Error('الطلب غير موجود'),{statusCode:404});
      if(order.status!=='FULFILLING') throw Object.assign(new Error('لا يمكن شحن الطلب في حالته الحالية'),{statusCode:409});
      const items=(await c.query(`SELECT id,item_type,fulfillment_status,result_router_id FROM order_items WHERE order_id=$1 ORDER BY created_at FOR UPDATE`,[order.id])).rows;
      if(!items.length || !items.every((x:any)=>x.item_type==='ROUTER')) throw Object.assign(new Error('زر الشحن مخصص لطلبات الراوترات فقط'),{statusCode:409});
      if(!items.every((x:any)=>x.fulfillment_status==='READY_TO_SHIP' && x.result_router_id)) throw Object.assign(new Error('كل الراوترات يجب أن تكون جاهزة للشحن أولًا'),{statusCode:409});
      const routerIds=items.map((x:any)=>x.result_router_id);
      await c.query(`UPDATE routers SET lifecycle_status='READY',shipped_at=COALESCE(shipped_at,now()),updated_at=now() WHERE id=ANY($1::uuid[])`,[routerIds]);
      await c.query(`UPDATE order_items SET fulfillment_status='SHIPPED',fulfillment_detail='SHIPPED' WHERE order_id=$1`,[order.id]);
      const updated=(await c.query(`UPDATE orders SET status='SHIPPED',updated_at=now() WHERE id=$1 RETURNING *`,[order.id])).rows[0];
      await audit(c,req,'order.router_shipped','orders',order.id,{orderCode:order.public_code,routerIds},order.customer_id);
      await c.query('COMMIT'); return updated;
    } catch(e){ await c.query('ROLLBACK'); throw e; } finally { c.release(); }
  });
  admin.post('/orders/:id/deliver', async (req:any) => {
    requirePermission(req,'orders:write'); requireCsrf(req);
    const c=await pool.connect();
    try { await c.query('BEGIN');
      const order=(await c.query(`SELECT id,public_code,customer_id,status FROM orders WHERE id=$1 FOR UPDATE`,[req.params.id])).rows[0];
      if(!order) throw Object.assign(new Error('الطلب غير موجود'),{statusCode:404});
      if(order.status!=='SHIPPED') throw Object.assign(new Error('لا يمكن تسجيل التسليم قبل شحن الطلب'),{statusCode:409});
      const items=(await c.query(`SELECT id,item_type,fulfillment_status,result_router_id FROM order_items WHERE order_id=$1 ORDER BY created_at FOR UPDATE`,[order.id])).rows;
      if(!items.length || !items.every((x:any)=>x.item_type==='ROUTER' && x.fulfillment_status==='SHIPPED')) throw Object.assign(new Error('الطلب ليس طلب راوترات مشحونًا بالكامل'),{statusCode:409});
      await c.query(`UPDATE order_items SET fulfillment_status='FULFILLED',fulfillment_detail='DELIVERED',fulfilled_at=now() WHERE order_id=$1`,[order.id]);
      const updated=(await c.query(`UPDATE orders SET status='COMPLETED',completed_at=COALESCE(completed_at,now()),updated_at=now() WHERE id=$1 RETURNING *`,[order.id])).rows[0];
      await audit(c,req,'order.router_delivered','orders',order.id,{orderCode:order.public_code},order.customer_id);
      await c.query('COMMIT'); return updated;
    } catch(e){ await c.query('ROLLBACK'); throw e; } finally { c.release(); }
  });
  '''
          s=s.replace(marker,routes+marker,1); main.write_text(s)
          worker=Path('apps/api/src/worker-v2.ts'); w=worker.read_text()
          old="const items=await c.query(`SELECT oi.*,o.customer_id,o.status order_status FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE oi.order_id=$1 AND (oi.fulfillment_status IN ('PENDING','IN_PROGRESS') OR (oi.fulfillment_status='NEEDS_ATTENTION' AND oi.fulfillment_detail='NO_CAPACITY')) ORDER BY CASE WHEN oi.item_type='ROUTER' THEN 0 ELSE 1 END,oi.created_at FOR UPDATE`,[job.subject_id]);let purchasedRouterId:string|null=null;"
          new="const items=await c.query(`SELECT oi.*,o.customer_id,o.status order_status FROM order_items oi JOIN orders o ON o.id=oi.order_id WHERE oi.order_id=$1 AND (oi.fulfillment_status IN ('PENDING','IN_PROGRESS') OR (oi.fulfillment_status='NEEDS_ATTENTION' AND oi.fulfillment_detail='NO_CAPACITY')) ORDER BY CASE WHEN oi.item_type='ROUTER' THEN 0 ELSE 1 END,oi.created_at FOR UPDATE`,[job.subject_id]);const routerOnly=items.rows.length>0&&items.rows.every((x:any)=>x.item_type==='ROUTER');let purchasedRouterId:string|null=null;"
          if old not in w: raise SystemExit('worker items marker not found')
          w=w.replace(old,new,1)
          old="await c.query(`UPDATE order_items SET fulfillment_status='FULFILLED',result_router_id=$1,fulfilled_at=now() WHERE id=$2`,[purchasedRouterId,item.id]);"
          new="const routerFulfillment=routerOnly?'READY_TO_SHIP':'FULFILLED';await c.query(`UPDATE order_items SET fulfillment_status=$1,result_router_id=$2,fulfilled_at=CASE WHEN $1='FULFILLED' THEN now() ELSE NULL END,fulfillment_detail=CASE WHEN $1='READY_TO_SHIP' THEN 'READY_TO_SHIP' ELSE NULL END WHERE id=$3`,[routerFulfillment,purchasedRouterId,item.id]);"
          if old not in w: raise SystemExit('worker router fulfillment marker not found')
          w=w.replace(old,new,1); worker.write_text(w)
          app=Path('apps/web/src/app.tsx'); a=app.read_text()
          old="READY:'جاهز',ASSIGNED:'مُسند',IN_STOCK:'في المخزن',ONLINE:'متصل'"; new="READY:'جاهز',ASSIGNED:'مُسند',IN_STOCK:'في المخزن',READY_TO_SHIP:'جاهز للشحن',SHIPPED:'تم الشحن',ONLINE:'متصل'"
          if old not in a: raise SystemExit('UI labels marker not found')
          a=a.replace(old,new,1)
          marker="const rejectPayment=async(id:string)=>{const reason=window.prompt('سبب رفض الدفع:','لم يتم استلام/مطابقة التحويل');if(reason===null)return;setLoading(true);setError('');try{await api(`/api/v1/admin/payments/${id}/reject`,{method:'POST',body:JSON.stringify({reason})});await load()}catch(e:any){setError(e.message)}finally{setLoading(false)}};"
          if marker not in a: raise SystemExit('UI rejectPayment marker not found')
          a=a.replace(marker,marker+"const shipRouterOrder=async(id:string)=>{if(!window.confirm('تأكيد شحن طلب الراوتر؟'))return;setLoading(true);setError('');try{await api(`/api/v1/admin/orders/${id}/ship`,{method:'POST',body:JSON.stringify({})});await load()}catch(e:any){setError(e.message)}finally{setLoading(false)}};const deliverRouterOrder=async(id:string)=>{if(!window.confirm('تأكيد استلام العميل للراوتر؟ سيتم إكمال الطلب.'))return;setLoading(true);setError('');try{await api(`/api/v1/admin/orders/${id}/deliver`,{method:'POST',body:JSON.stringify({})});await load()}catch(e:any){setError(e.message)}finally{setLoading(false)}};",1)
          old="{['services','subscriptions','routers','servers','payments'].includes(kind)&&<td>"; new="{['services','subscriptions','routers','servers','payments','orders'].includes(kind)&&<td>"
          if old not in a: raise SystemExit('UI action column marker not found')
          a=a.replace(old,new,1)
          old="{kind==='payments'&&String(row.status)==='PENDING'&&<><button className=\"small-button\" onClick={()=>confirmPayment(row.id)}>تأكيد الدفع</button><button className=\"small-button danger\" onClick={()=>rejectPayment(row.id)}>رفض</button></>}"
          new="{kind==='payments'&&String(row.status)==='PENDING'&&<><button className=\"small-button\" onClick={()=>confirmPayment(row.id)}>تأكيد الدفع</button><button className=\"small-button danger\" onClick={()=>rejectPayment(row.id)}>رفض</button></>}{kind==='orders'&&row.router_only&&String(row.status)==='FULFILLING'&&<button className=\"small-button\" onClick={()=>shipRouterOrder(row.id)}>شحن الطلب</button>}{kind==='orders'&&row.router_only&&String(row.status)==='SHIPPED'&&<button className=\"small-button\" onClick={()=>deliverRouterOrder(row.id)}>تم التسليم</button>}"
          if old not in a: raise SystemExit('UI payment action marker not found')
          a=a.replace(old,new,1); app.write_text(a)
          PY
          npm install
          npm run typecheck --workspace @cowboybepob/api
          npm run build --workspace @cowboybepob/web
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/main.ts apps/api/src/worker-v2.ts apps/web/src/app.tsx
          git diff --cached --quiet && { echo 'No changes'; exit 0; }
          git commit -m 'feat: add manual router shipping and delivery lifecycle'
          git push origin main
      - name: Remove one-off workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          rm -f .github/workflows/implement-router-shipping.yml
          git add -u .github/workflows/implement-router-shipping.yml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: remove one-off router shipping workflow'
            git push origin main
          fi
