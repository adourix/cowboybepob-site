name: Fix payment reject SQL
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch reject query
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/api/src/main.ts')
          s = p.read_text()
          old = "jsonb_build_object('rejectionReason',$1)"
          new = "jsonb_build_object('rejectionReason',$1::text)"
          if old not in s:
              raise SystemExit('target SQL not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/main.ts .github/workflows/fix-payment-reject.yml
          git commit -m 'fix: cast payment rejection reason parameter'
          git push
          git rm .github/workflows/fix-payment-reject.yml
          git commit -m 'chore: remove one-off payment reject workflow'
          git push
