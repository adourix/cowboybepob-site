name: Platform consistency repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair
        run: |
          if [ ! -f PLATFORM_FIX_TRIGGER.md ]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path

          p=Path('db/schema.sql'); s=p.read_text(); old="plan_id uuid NOT NULL REFERENCES config_plans(id),router_id uuid REFERENCES routers(id)"; new="plan_id uuid REFERENCES config_plans(id),router_id uuid REFERENCES routers(id)"
          if old not in s: raise SystemExit('schema services plan_id pattern not found')
          p.write_text(s.replace(old,new,1))
          Path('db/migrations/004_optional_service_subscription.sql').write_text("ALTER TABLE services ALTER COLUMN plan_id DROP NOT NULL;\n")

          p=Path('apps/api/src/main.ts'); s=p.read_text()
          old="""    requirePermission(req,'services:write'); requireCsrf(req); const b=req.body||{}; const customerId=String(b.customerId||''),planId=String(b.planId||''),routerId=b.routerId?String(b.routerId):null; if(!customerId||!planId||!b.link) throw Object.assign(new Error('العميل والخطة والرابط مطلوبة'),{statusCode:400});
    const cr=await db(`SELECT id FROM customers WHERE id=$1 AND status<>'DELETED'`,[customerId]); if(!cr.rowCount) throw Object.assign(new Error('العميل غير موجود'),{statusCode:404});
    const pr=await db(`SELECT p.*,c.id category_id,c.protocol,c.name category_name FROM config_plans p JOIN config_categories c ON c.id=p.category_id WHERE p.id=$1 AND p.status='ACTIVE'`,[planId]); if(!pr.rowCount) throw Object.assign(new Error('الخطة غير موجودة أو غير نشطة'),{statusCode:400}); const p=pr.rows[0], parsed=parseManualClientLink(String(b.link));
    if(parsed.protocol!==p.protocol) throw Object.assign(new Error(`الرابط ${parsed.protocol.toUpperCase()} لا يطابق بروتوكول الخطة ${p.protocol.toUpperCase()}`),{statusCode:400});"""
          new="""    requirePermission(req,'services:write'); requireCsrf(req); const b=req.body||{}; const customerId=String(b.customerId||''),planId=b.planId?String(b.planId):null,categoryId=b.categoryId?String(b.categoryId):null,routerId=b.routerId?String(b.routerId):null; if(!customerId||!b.link) throw Object.assign(new Error('العميل والرابط مطلوبان'),{statusCode:400});
    const cr=await db(`SELECT id FROM customers WHERE id=$1 AND status<>'DELETED'`,[customerId]); if(!cr.rowCount) throw Object.assign(new Error('العميل غير موجود'),{statusCode:404});
    const parsed=parseManualClientLink(String(b.link)); let category:any=null; let p:any=null;
    if(planId){ const pr=await db(`SELECT p.*,c.id category_id,c.protocol,c.name category_name FROM config_plans p JOIN config_categories c ON c.id=p.category_id WHERE p.id=$1 AND p.status='ACTIVE'`,[planId]); if(!pr.rowCount) throw Object.assign(new Error('الخطة غير موجودة أو غير نشطة'),{statusCode:400}); p=pr.rows[0]; category=p; }
    else { if(!categoryId) throw Object.assign(new Error('اختر الفئة عند إنشاء خدمة بدون اشتراك'),{statusCode:400}); const cr2=await db(`SELECT id,protocol,name FROM config_categories WHERE id=$1 AND status='ACTIVE'`,[categoryId]); if(!cr2.rowCount) throw Object.assign(new Error('الفئة غير موجودة أو غير نشطة'),{statusCode:400}); category=cr2.rows[0]; }
    if(parsed.protocol!==category.protocol) throw Object.assign(new Error(`الرابط ${parsed.protocol.toUpperCase()} لا يطابق بروتوكول الفئة ${category.protocol.toUpperCase()}`),{statusCode:400});"""
          if old not in s: raise SystemExit('manual validation block not found')
          s=s.replace(old,new,1)
          old="""    const c=await pool.connect(); try{await c.query('BEGIN'); const svc=(await c.query(`INSERT INTO services(customer_id,category_id,plan_id,router_id,label,status,provisioning_mode) VALUES($1,$2,$3,$4,$5,'ACTIVE','MANUAL') RETURNING id,public_code`,[customerId,p.category_id,p.id,routerId,String(b.label||'').trim()||p.category_name+' - '+p.name])).rows[0]; const end=new Date(Date.now()+Number(p.duration_days)*86400000); const sub=(await c.query(`INSERT INTO subscriptions(service_id,plan_id,status,starts_at,current_period_end,quota_bytes) VALUES($1,$2,'ACTIVE',now(),$3,$4) RETURNING id`,[svc.id,p.id,end,p.quota_bytes])).rows[0]; await c.query(`INSERT INTO configs(service_id,version,status,protocol,transport,security,client_credential_enc,credential_key_id,params,manual_link_enc) VALUES($1,1,'CURRENT',$2,$3,$4,$5,'env-v1',$6,$7)`,[svc.id,parsed.protocol,parsed.transport,parsed.security,encryptSecret(parsed.uuid),JSON.stringify({...parsed.params,address:parsed.address,port:parsed.port}),encryptSecret(String(b.link).trim())]); await audit(c,req,'service.manual_created','services',svc.id,{mode:'MANUAL',protocol:parsed.protocol,routerId},customerId); await c.query('COMMIT'); return {id:svc.id,public_code:svc.public_code,subscriptionId:sub.id}; }catch(e){await c.query('ROLLBACK');throw e}finally{c.release()}"""
          new="""    const c=await pool.connect(); try{await c.query('BEGIN'); const svc=(await c.query(`INSERT INTO services(customer_id,category_id,plan_id,router_id,label,status,provisioning_mode) VALUES($1,$2,$3,$4,$5,'ACTIVE','MANUAL') RETURNING id,public_code`,[customerId,category.id,p?.id||null,routerId,String(b.label||'').trim()||(p?`${p.category_name} - ${p.name}`:`${category.name} - خدمة يدوية`)])).rows[0]; let sub:any=null; if(p){ const end=new Date(Date.now()+Number(p.duration_days)*86400000); sub=(await c.query(`INSERT INTO subscriptions(service_id,plan_id,status,starts_at,current_period_end,quota_bytes) VALUES($1,$2,'ACTIVE',now(),$3,$4) RETURNING id`,[svc.id,p.id,end,p.quota_bytes])).rows[0]; } await c.query(`INSERT INTO configs(service_id,version,status,protocol,transport,security,client_credential_enc,credential_key_id,params,manual_link_enc) VALUES($1,1,'CURRENT',$2,$3,$4,$5,'env-v1',$6,$7)`,[svc.id,parsed.protocol,parsed.transport,parsed.security,encryptSecret(parsed.uuid),JSON.stringify({...parsed.params,address:parsed.address,port:parsed.port}),encryptSecret(String(b.link).trim())]); await audit(c,req,'service.manual_created','services',svc.id,{mode:'MANUAL',protocol:parsed.protocol,routerId,subscription:!!sub},customerId); await c.query('COMMIT'); return {id:svc.id,public_code:svc.public_code,subscriptionId:sub?.id||null}; }catch(e){await c.query('ROLLBACK');throw e}finally{c.release()}"""
          if old not in s: raise SystemExit('manual insert block not found')
          s=s.replace(old,new,1)
          old="""  customer.post('/services/:id/renew', async (req:Req) => { requireCsrf(req);const service=await db(`SELECT s.*,p.id plan_id,p.name plan_name,p.duration_days,p.price_minor,p.currency FROM services s JOIN config_plans p ON p.id=s.plan_id WHERE s.id=$1 AND s.customer_id=$2`,[req.params.id,req.principal!.id);if(!service.rowCount)throw Object.assign(new Error('Not found'),{statusCode:404});const x=service.rows[0];"""
          new="""  customer.post('/services/:id/renew', async (req:Req) => { requireCsrf(req);const service=await db(`SELECT s.*,p.id plan_id,p.name plan_name,p.duration_days,p.price_minor,p.currency FROM services s LEFT JOIN config_plans p ON p.id=s.plan_id WHERE s.id=$1 AND s.customer_id=$2`,[req.params.id,req.principal!.id);if(!service.rowCount)throw Object.assign(new Error('Not found'),{statusCode:404});const x=service.rows[0];if(!x.plan_id)throw Object.assign(new Error('هذه الخدمة ليس لها اشتراك حالي أو خطة مرتبطة للتجديد'),{statusCode:400});"""
          if old not in s: raise SystemExit('renew block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('apps/web/src/admin-tools.tsx'); s=p.read_text()
          old="""export function ManualServicePage(){const[v,setV]=useState<any>({});const[cust,setCust]=useState<any[]>([]);const[cat,setCat]=useState<any>({plans:[]});const[routers,setRouters]=useState<any[]>([]);const[error,setError]=useState('');const[ok,setOk]=useState('');const load=()=>void Promise.all([api('/api/v1/admin/customers'),api('/api/v1/admin/catalog'),api('/api/v1/admin/routers')]).then(([c,k,r])=>{setCust(c);setCat(k);setRouters(r)}).catch(e=>setError(e.message));useEffect(load,[]);const plans=(cat.plans||[]).filter((p:any)=>p.status==='ACTIVE');const rs=routers.filter(r=>(!r.customer_id||r.customer_id===v.customerId)&&!['DECOMMISSIONED','REPLACED'].includes(r.lifecycle_status));const save=async(e:FormEvent)=>{e.preventDefault();setError('');setOk('');try{const x=await api('/api/v1/admin/services/manual',{method:'POST',body:JSON.stringify(v)});setOk(`تم إنشاء ${x.public_code} وتفعيل الاشتراك. الرابط سيظهر للعميل فورًا.`);setV({});}catch(e:any){setError(e.message)}};return <div className=\"page\"><div className=\"page-heading\"><div><div className=\"eyebrow\">CowboyBepob</div><h1>إضافة خدمة يدوية</h1><p>أدخل VLESS أو VMess جاهزًا. الراوتر اختياري؛ بدون راوتر تصبح الخدمة Standalone.</p></div></div><section className=\"panel manual-form\"><form onSubmit={save}><label>العميل<select value={v.customerId||''} onChange={e=>setV({...v,customerId:e.target.value,routerId:''})} required><option value=\"\">اختر العميل</option>{cust.map(c=><option key={c.id} value={c.id}>{c.full_name} · {c.public_code}</option>)}</select></label><label>الخطة<select value={v.planId||''} onChange={e=>setV({...v,planId:e.target.value})} required><option value=\"\">اختر الخطة</option>{plans.map((p:any)=><option key={p.id} value={p.id}>{p.category_name} · {p.name} · {p.protocol} · {money(p.price_minor)}</option>)}</select></label>"""
          new="""export function ManualServicePage(){const[v,setV]=useState<any>({});const[cust,setCust]=useState<any[]>([]);const[cat,setCat]=useState<any>({categories:[],plans:[]});const[routers,setRouters]=useState<any[]>([]);const[error,setError]=useState('');const[ok,setOk]=useState('');const load=()=>void Promise.all([api('/api/v1/admin/customers'),api('/api/v1/admin/catalog'),api('/api/v1/admin/routers')]).then(([c,k,r])=>{setCust(c);setCat(k);setRouters(r)}).catch(e=>setError(e.message));useEffect(load,[]);const categories=(cat.categories||[]).filter((c:any)=>c.status==='ACTIVE');const plans=(cat.plans||[]).filter((p:any)=>p.status==='ACTIVE'&&(!v.categoryId||p.category_id===v.categoryId));const rs=routers.filter(r=>(!r.customer_id||r.customer_id===v.customerId)&&!['DECOMMISSIONED','REPLACED'].includes(r.lifecycle_status));const save=async(e:FormEvent)=>{e.preventDefault();setError('');setOk('');try{const x=await api('/api/v1/admin/services/manual',{method:'POST',body:JSON.stringify(v)});setOk(x.subscriptionId?`تم إنشاء ${x.public_code} مع اشتراك فعال. الرابط سيظهر للعميل فورًا.`:`تم إنشاء ${x.public_code} بدون اشتراك. الرابط سيظهر للعميل فورًا.`);setV({});}catch(e:any){setError(e.message)}};return <div className=\"page\"><div className=\"page-heading\"><div><div className=\"eyebrow\">CowboyBepob</div><h1>إضافة خدمة يدوية</h1><p>أدخل VLESS أو VMess جاهزًا. يمكنك إنشاء الخدمة باشتراك أو بدون اشتراك، والراوتر اختياري.</p></div></div><section className=\"panel manual-form\"><form onSubmit={save}><label>العميل<select value={v.customerId||''} onChange={e=>setV({...v,customerId:e.target.value,routerId:''})} required><option value=\"\">اختر العميل</option>{cust.map(c=><option key={c.id} value={c.id}>{c.full_name} · {c.public_code}</option>)}</select></label><label>الفئة<select value={v.categoryId||''} onChange={e=>setV({...v,categoryId:e.target.value,planId:''})} required><option value=\"\">اختر الفئة</option>{categories.map((c:any)=><option key={c.id} value={c.id}>{c.name} · {c.protocol}</option>)}</select></label><label>الاشتراك <span className=\"muted-note\">(اختياري)</span><select value={v.planId||''} onChange={e=>setV({...v,planId:e.target.value||null})}><option value=\"\">بدون اشتراك حالي</option>{plans.map((p:any)=><option key={p.id} value={p.id}>{p.name} · {p.duration_days} يوم · {money(p.price_minor)}</option>)}</select></label>"""
          if old not in s: raise SystemExit('manual UI block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('apps/web/src/app.tsx'); s=p.read_text()
          old="<button className=\"primary-button\" type=\"button\" onClick={()=>reveal(s.id)}>عرض الكونفيج</button><button className=\"secondary-button\" type=\"button\" onClick={()=>renew(s.id)}>تجديد</button>"; new="<button className=\"primary-button\" type=\"button\" onClick={()=>reveal(s.id)}>عرض الكونفيج</button>{s.subscription_status&&<button className=\"secondary-button\" type=\"button\" onClick={()=>renew(s.id)}>تجديد</button>}"
          if old not in s: raise SystemExit('renew UI block not found')
          s=s.replace(old,new,1)
          old="""function RouterForm({onClose,onDone}:{onClose:()=>void;onDone:()=>void}){const[v,setV]=useState<any>({});const[error,setError]=useState('');const save=async(e:FormEvent)=>{e.preventDefault();try{await api('/api/v1/admin/routers',{method:'POST',body:JSON.stringify(v)});onDone()}catch(e:any){setError(e.message)}};return <Modal title=\"تسجيل راوتر\" onClose={onClose}><form onSubmit={save}><Field label=\"Serial Number\" value={v.serialNumber||''} onChange={x=>setV({...v,serialNumber:x})}/><Field label=\"Device ID\" value={v.deviceIdentifier||''} onChange={x=>setV({...v,deviceIdentifier:x})} required={false}/><Field label=\"Model\" value={v.model||''} onChange={x=>setV({...v,model:x})}/><Field label=\"Firmware\" value={v.firmwareVersion||''} onChange={x=>setV({...v,firmwareVersion:x})} required={false}/>{error&&<div className=\"alert error\">{error}</div>}<button className=\"primary-button full\">حفظ الراوتر</button></form></Modal>}"""
          new="""function RouterForm({onClose,onDone}:{onClose:()=>void;onDone:()=>void}){const[v,setV]=useState<any>({});const[customers,setCustomers]=useState<any[]>([]);const[error,setError]=useState('');useEffect(()=>{void api('/api/v1/admin/customers').then(x=>setCustomers(Array.isArray(x)?x:[])).catch(e=>setError(e.message))},[]);const save=async(e:FormEvent)=>{e.preventDefault();try{await api('/api/v1/admin/routers',{method:'POST',body:JSON.stringify(v)});onDone()}catch(e:any){setError(e.message)}};return <Modal title=\"تسجيل راوتر\" onClose={onClose}><form onSubmit={save}><Field label=\"Serial Number\" value={v.serialNumber||''} onChange={x=>setV({...v,serialNumber:x})}/><Field label=\"Device ID\" value={v.deviceIdentifier||''} onChange={x=>setV({...v,deviceIdentifier:x})} required={false}/><Field label=\"Model\" value={v.model||''} onChange={x=>setV({...v,model:x})}/><Field label=\"Firmware\" value={v.firmwareVersion||''} onChange={x=>setV({...v,firmwareVersion:x})} required={false}/><label>العميل <span className=\"muted-note\">(اختياري)</span><select value={v.customerId||''} onChange={e=>setV({...v,customerId:e.target.value||null})}><option value=\"\">بدون عميل — في المخزن</option>{customers.map(c=><option key={c.id} value={c.id}>{c.full_name} · {c.public_code}</option>)}</select></label>{error&&<div className=\"alert error\">{error}</div>}<button className=\"primary-button full\">حفظ الراوتر</button></form></Modal>}"""
          if old not in s: raise SystemExit('router form block not found')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .github/workflows/platform-consistency-fix.yml .github/workflows/platform-consistency-fix-v2.yml .github/workflows/_test.yml PLATFORM_FIX_TRIGGER.md WORKFLOW_TEST_TRIGGER.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/schema.sql db/migrations/004_optional_service_subscription.sql apps/api/src/main.ts apps/web/src/admin-tools.tsx apps/web/src/app.tsx .github/workflows/platform-consistency-fix.yml .github/workflows/platform-consistency-fix-v2.yml .github/workflows/_test.yml PLATFORM_FIX_TRIGGER.md WORKFLOW_TEST_TRIGGER.md
          git commit -m "fix: align services subscriptions routers [platform-consistency]"
          git push origin main
