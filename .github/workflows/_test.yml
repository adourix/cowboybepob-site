name: Platform consistency repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair
        run: |
          if [ ! -f PLATFORM_FIX_TRIGGER.md ]; then exit 0; fi
          python3 scripts/platform_consistency_repair.py
          rm -f .github/workflows/platform-consistency-fix.yml .github/workflows/platform-consistency-fix-v2.yml .github/workflows/_test.yml PLATFORM_FIX_TRIGGER.md WORKFLOW_TEST_TRIGGER.md scripts/platform_consistency_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/schema.sql db/migrations/004_optional_service_subscription.sql apps/api/src/main.ts apps/web/src/admin-tools.tsx apps/web/src/app.tsx .github/workflows/platform-consistency-fix.yml .github/workflows/platform-consistency-fix-v2.yml .github/workflows/_test.yml PLATFORM_FIX_TRIGGER.md WORKFLOW_TEST_TRIGGER.md scripts/platform_consistency_repair.py
          git commit -m "fix: align services subscriptions routers [platform-consistency]"
          git push origin main
