name: Fix TypeScript action indexing

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, '[ts-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix action maps
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/api/src/main.ts')
          s = p.read_text()
          s = s.replace(
              "const action=req.body?.action;const id=req.params.id;const next:any={suspend:'SUSPENDED',resume:'ACTIVE',terminate:'TERMINATED',retry:'PROVISIONING'}[action];",
              "const action=String(req.body?.action||'');const id=req.params.id;const next:any=({suspend:'SUSPENDED',resume:'ACTIVE',terminate:'TERMINATED',retry:'PROVISIONING'} as Record<string,string>)[action];"
          )
          s = s.replace(
              "const next:any={assign:'ASSIGNED',provision:'PROVISIONING',ready:'READY',replace:'REPLACED',decommission:'DECOMMISSIONED',unassign:'IN_STOCK'}[req.body?.action];",
              "const action=String(req.body?.action||'');const next:any=({assign:'ASSIGNED',provision:'PROVISIONING',ready:'READY',replace:'REPLACED',decommission:'DECOMMISSIONED',unassign:'IN_STOCK'} as Record<string,string>)[action];"
          )
          s = s.replace(
              "`router-action:${id}:${action}:${Date.now()}`",
              "`router-action:${id}:${action}:${Date.now()}`"
          )
          p.write_text(s)
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/main.ts
          git rm .github/workflows/fix-main-ts.yml
          git diff --cached --quiet || git commit -m "fix: type service and router action maps [ts-fix]"
          git push