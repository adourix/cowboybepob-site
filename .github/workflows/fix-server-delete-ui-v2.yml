name: Fix Server Delete UI v2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-server-delete-ui-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch actual servers page
        run: python scripts/patch_server_delete_ui.py

      - name: Verify build
        run: |
          npm install --include=dev
          npm run build

      - name: Commit source and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/patch_server_delete_ui.py .github/workflows/fix-server-delete-ui-v2.yml
          git add apps/web/src/app.tsx scripts/patch_server_delete_ui.py .github/workflows/fix-server-delete-ui-v2.yml
          git commit -m 'fix: add delete action to servers page'
          git push
