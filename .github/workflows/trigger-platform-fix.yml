name: Trigger platform fix
on:
  push:
    branches: [main]
permissions:
  actions: write
  contents: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Dispatch patch workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-platform-fix.yml --ref main
      - name: Remove trigger workflow
        run: |
          rm -f .github/workflows/trigger-platform-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/trigger-platform-fix.yml
          git commit -m "chore: remove temporary platform trigger [skip ci]" || exit 0
          git push origin main
