name: Admin join fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/main.ts'); s=p.read_text()
          old="FROM services s JOIN customers cu ON cu.id=s.customer_id JOIN config_categories c ON c.id=s.category_id LEFT JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN service_allocations sa ON sa.service_id=s.id AND sa.status='ACTIVE'"
          new="FROM services s JOIN customers cu ON cu.id=s.customer_id JOIN config_categories c ON c.id=s.category_id LEFT JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN routers r ON r.id=s.router_id LEFT JOIN service_allocations sa ON sa.service_id=s.id AND sa.status='ACTIVE'"
          if old not in s: raise SystemExit('admin service query pattern not found')
          p.write_text(s.replace(old,new,1))
          PY
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/main.ts
          git commit -m "fix: join router data in admin services query [skip ci]"
          git push origin main
