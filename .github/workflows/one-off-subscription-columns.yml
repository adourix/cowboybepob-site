name: One-off subscription columns fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace expiry with config on services table
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/src/app.tsx')
          s = p.read_text(encoding='utf-8')
          old = "services:{title:'الخدمات',endpoint:'/api/v1/admin/services',cols:['الكود','العميل','الفئة','البروتوكول','الحالة','الانتهاء'],keys:['public_code','customer_name','category','protocol','status','current_period_end']}"
          new = "services:{title:'الخدمات',endpoint:'/api/v1/admin/services',cols:['الكود','العميل','الفئة','البروتوكول','الحالة','الكونفيج'],keys:['public_code','customer_name','category','protocol','status','config_code']}"
          if old not in s:
              raise SystemExit('target services table metadata not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Remove this one-off workflow and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-off-subscription-columns.yml
          git add apps/web/src/app.tsx
          git commit -m 'fix: show config instead of expiry in subscription table'
          git push
