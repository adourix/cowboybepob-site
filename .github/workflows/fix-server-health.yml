name: Fix server health monitoring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add infrastructure health monitor
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/api/src/main.ts')
          s = p.read_text()
          old_import = "import { sendPasswordResetEmail, sendVerificationEmail } from './email.js';"
          new_import = old_import + "\nimport { MarzbanProvider } from './marzban.js';"
          if old_import not in s:
              raise SystemExit('email import not found')
          if "async function refreshInfrastructureHealth()" not in s:
              monitor = r'''\n\nasync function refreshInfrastructureHealth() {\n  const r = await db(`SELECT h.id,h.provider_instance_id,p.base_url,p.status provider_status FROM hosts h JOIN provider_instances p ON p.id=h.provider_instance_id WHERE h.status <> 'DECOMMISSIONED'`);\n  for (const host of r.rows) {\n    const checkedAt = new Date();\n    let health: 'HEALTHY'|'DEGRADED'|'DOWN' = 'HEALTHY';\n    try {\n      if (host.provider_status !== 'ACTIVE') throw new Error('provider disabled');\n      await new MarzbanProvider(host.base_url).health();\n      await db('UPDATE provider_instances SET last_ok_at=now(),updated_at=now() WHERE id=$1',[host.provider_instance_id]);\n    } catch {\n      health = 'DOWN';\n    }\n    await db('UPDATE hosts SET health_status=$1,last_health_check_at=$2,updated_at=now() WHERE id=$3',[health,checkedAt,host.id]);\n    await db('UPDATE server_endpoints SET health_status=$1,last_health_check_at=$2,updated_at=now() WHERE host_id=$3',[health,checkedAt,host.id]);\n  }\n}\n'''
              s = s.replace(old_import, new_import + monitor, 1)
          marker = 'await seed();'
          if 'void refreshInfrastructureHealth();' not in s:
              if marker not in s:
                  raise SystemExit('seed call not found')
              replacement = marker + "\n  void refreshInfrastructureHealth().catch((error) => app.log.error({ error }, 'initial infrastructure health check failed'));\n  setInterval(() => void refreshInfrastructureHealth().catch((error) => app.log.error({ error }, 'infrastructure health check failed')), 30000);"
              s = s.replace(marker, replacement, 1)
          p.write_text(s)
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-server-health.yml
          git add apps/api/src/main.ts .github/workflows/fix-server-health.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: monitor Marzban server health"
          git push