name: Enforce host address format
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch API validation
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('apps/api/src/main.ts')
          s=p.read_text()
          marker="app.addHook('preHandler', authenticate);"
          hook="""\napp.addHook('preHandler', async (req: Req) => {\n  if (req.method !== 'POST' || !req.url.includes('/api/v1/admin/servers')) return;\n  const body = (req.body || {}) as any;\n  if (typeof body.address !== 'string') return;\n  const address = body.address.trim();\n  if (!address || address.includes('://') || (address.includes(':') && !/^\\[[0-9a-fA-F:]+\\]$/.test(address))) {\n    throw Object.assign(new Error('عنوان الخادم يجب أن يكون IP أو hostname فقط. بورت Marzban موجود داخل الـProvider.'), { statusCode: 400 });\n  }\n  body.address = address;\n});"""
          if "عنوان الخادم يجب أن يكون IP أو hostname فقط" not in s:
              s=s.replace(marker,marker+hook,1)
          p.write_text(s)
          PY
          git diff --check
      - name: Verify build
        run: |
          npm install
          npm run build
      - name: Commit and remove verifier
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/main.ts
          git rm .github/workflows/enforce-host-address.yml
          git commit -m "fix: enforce host address without port"
          git push