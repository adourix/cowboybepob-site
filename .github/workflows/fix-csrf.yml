name: Fix stale CSRF handling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CSRF client handling
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/src/app.tsx')
          s = p.read_text()
          old = "async function api(path:string,init:RequestInit={}){const h=new Headers(init.headers);h.set('content-type','application/json');const csrf=document.cookie.split('; ').find(x=>x.startsWith('cb_csrf='))?.split('=')[1];if(csrf&&init.method&&init.method!=='GET')h.set('x-csrf-token',csrf);const r=await fetch(API.replace(/\\/$/,'')+path,{...init,headers:h,credentials:'include'});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}"
          new = "function setCsrfCookie(token:string){document.cookie=`cb_csrf=${encodeURIComponent(token)}; Path=/; SameSite=Lax`}\nfunction getCsrfCookie(){return document.cookie.split('; ').find(x=>x.startsWith('cb_csrf='))?.split('=')[1]||''}\nasync function api(path:string,init:RequestInit={}){const url=API.replace(/\\/$/,'')+path;const method=String(init.method||'GET').toUpperCase();const h=new Headers(init.headers);h.set('content-type','application/json');const csrf=getCsrfCookie();if(csrf&&method!=='GET')h.set('x-csrf-token',decodeURIComponent(csrf));let r=await fetch(url,{...init,headers:h,credentials:'include',cache:method==='GET'?'no-store':init.cache});let data=await r.json().catch(()=>({}));if(!r.ok&&r.status===403&&data.error==='CSRF validation failed'&&method!=='GET'){const sync=await fetch(API.replace(/\\/$/,'')+'/api/v1/auth/me',{credentials:'include',cache:'no-store'});const syncData=await sync.json().catch(()=>({}));if(sync.ok&&syncData.csrf){setCsrfCookie(syncData.csrf);h.set('x-csrf-token',syncData.csrf);r=await fetch(url,{...init,headers:h,credentials:'include',cache:init.cache});data=await r.json().catch(()=>({}))}}if(path==='/api/v1/auth/me'&&data.csrf)setCsrfCookie(data.csrf);if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`);return data}"
          if old not in s:
              raise SystemExit('expected api helper not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-csrf.yml
          git add apps/web/src/app.tsx .github/workflows/fix-csrf.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: refresh stale csrf token in web client"
          git push