name: Apply platform service and router fixes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch project
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) Schema: manual services + encrypted original client link.
          schema = root/'db/schema.sql'
          s = schema.read_text()
          s = s.replace(
              "label text,status text NOT NULL DEFAULT 'PROVISIONING',suspend_reason text,origin_order_item_id uuid UNIQUE,created_at",
              "label text,status text NOT NULL DEFAULT 'PROVISIONING',provisioning_mode text NOT NULL DEFAULT 'MANAGED' CHECK(provisioning_mode IN('MANAGED','MANUAL')),suspend_reason text,origin_order_item_id uuid UNIQUE,created_at"
          )
          s = s.replace(
              "credential_key_id text NOT NULL,params jsonb NOT NULL DEFAULT '{}',created_at",
              "credential_key_id text NOT NULL,params jsonb NOT NULL DEFAULT '{}',manual_link_enc bytea,created_at"
          )
          schema.write_text(s)

          # 2) Migration for existing installations.
          mig = root/'db/migrations/003_manual_services.sql'
          mig.write_text("""ALTER TABLE services\n  ADD COLUMN IF NOT EXISTS provisioning_mode text NOT NULL DEFAULT 'MANAGED';\n\nALTER TABLE configs\n  ADD COLUMN IF NOT EXISTS manual_link_enc bytea;\n\nDO $$\nBEGIN\n  IF NOT EXISTS (\n    SELECT 1 FROM pg_constraint\n    WHERE conname='services_provisioning_mode_check'\n  ) THEN\n    ALTER TABLE services\n      ADD CONSTRAINT services_provisioning_mode_check\n      CHECK (provisioning_mode IN ('MANAGED','MANUAL'));\n  END IF;\nEND $$;\n\nCREATE INDEX IF NOT EXISTS services_provisioning_mode_idx\n  ON services(provisioning_mode);\n""")

          # 3) API helpers and manual-service endpoint.
          api = root/'apps/api/src/main.ts'
          a = api.read_text()

          marker = "function errorStatus(e: any) { return Number(e?.statusCode) || 500; }"
          helper = r'''function parseManualClientLink(raw: string) {
  const link = String(raw || '').trim();
  if (!link) throw Object.assign(new Error('رابط الكونفيج مطلوب'), { statusCode: 400 });
  if (link.startsWith('vless://')) {
    let u: URL;
    try { u = new URL(link); } catch { throw Object.assign(new Error('رابط VLESS غير صالح'), { statusCode: 400 }); }
    const uuid = decodeURIComponent(u.username || '');
    const port = Number(u.port);
    if (!uuid || !u.hostname || !Number.isInteger(port) || port < 1 || port > 65535) throw Object.assign(new Error('رابط VLESS غير مكتمل'), { statusCode: 400 });
    const params: Record<string, any> = {};
    for (const k of ['type','security','sni','host','path','flow','fp','alpn','serviceName']) if (u.searchParams.get(k)) params[k] = u.searchParams.get(k);
    return { protocol:'vless', uuid, address:u.hostname, port, transport:params.type || 'tcp', security:params.security || 'none', params };
  }
  if (link.startsWith('vmess://')) {
    try {
      const encoded = link.slice('vmess://'.length).replace(/-/g,'+').replace(/_/g,'/');
      const padded = encoded + '='.repeat((4 - encoded.length % 4) % 4);
      const obj = JSON.parse(Buffer.from(padded, 'base64').toString('utf8'));
      const uuid = String(obj.id || obj.uuid || '');
      const address = String(obj.add || obj.address || '');
      const port = Number(obj.port);
      if (!uuid || !address || !Number.isInteger(port) || port < 1 || port > 65535) throw new Error('incomplete');
      const params: Record<string, any> = {};
      for (const k of ['host','path','sni','flow','fp','alpn','serviceName']) if (obj[k]) params[k] = obj[k];
      return { protocol:'vmess', uuid, address, port, transport:String(obj.net || 'tcp'), security:obj.tls ? 'tls' : 'none', params };
    } catch { throw Object.assign(new Error('رابط VMess غير صالح'), { statusCode: 400 }); }
  }
  throw Object.assign(new Error('الرابط يجب أن يبدأ بـ vless:// أو vmess://'), { statusCode: 400 });
}
'''
          if "function parseManualClientLink" not in a:
              a = a.replace(marker, marker + "\n" + helper)

          # Include router code and provisioning mode in admin services.
          old_services = "SELECT s.id,s.public_code,s.label,s.status,s.created_at,c.name category,c.protocol,sub.status subscription_status,sub.current_period_end,sub.starts_at,sub.used_bytes,sub.quota_bytes,cu.public_code customer_code,cu.full_name customer_name,h.city,h.country,se.public_code endpoint_code FROM services s JOIN customers cu ON cu.id=s.customer_id JOIN config_categories c ON c.id=s.category_id LEFT JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN service_allocations sa ON sa.service_id=s.id AND sa.status='ACTIVE' LEFT JOIN server_endpoints se ON se.id=sa.endpoint_id LEFT JOIN hosts h ON h.id=se.host_id ORDER BY s.created_at DESC LIMIT 200"
          new_services = "SELECT s.id,s.public_code,s.label,s.status,s.provisioning_mode,s.created_at,c.name category,c.protocol,sub.status subscription_status,sub.current_period_end,sub.starts_at,sub.used_bytes,sub.quota_bytes,cu.public_code customer_code,cu.full_name customer_name,r.public_code router_code,h.city,h.country,se.public_code endpoint_code FROM services s JOIN customers cu ON cu.id=s.customer_id JOIN config_categories c ON c.id=s.category_id LEFT JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN routers r ON r.id=s.router_id LEFT JOIN service_allocations sa ON sa.service_id=s.id AND sa.status='ACTIVE' LEFT JOIN server_endpoints se ON se.id=sa.endpoint_id LEFT JOIN hosts h ON h.id=se.host_id ORDER BY s.created_at DESC LIMIT 200"
          if old_services in a:
              a = a.replace(old_services, new_services)

          # Manual service creation endpoint, placed before service actions.
          service_marker = "  admin.post('/services/:id/action', async (req:any) => {"
          manual_route = r'''  admin.post('/services/manual', async (req:any) => {
    requirePermission(req,'services:write'); requireCsrf(req);
    const b=req.body||{}; const customerId=String(b.customerId||''); const planId=String(b.planId||''); const routerId=b.routerId?String(b.routerId):null; const labelText=String(b.label||'').trim();
    if(!customerId||!planId||!b.link) throw Object.assign(new Error('العميل والخطة والرابط مطلوبة'),{statusCode:400});
    const customer=await db('SELECT id FROM customers WHERE id=$1 AND status<>\'DELETED\'',[customerId]); if(!customer.rowCount) throw Object.assign(new Error('العميل غير موجود'),{statusCode:404});
    const plan=await db(`SELECT p.*,c.id category_id,c.protocol,c.name category_name FROM config_plans p JOIN config_categories c ON c.id=p.category_id WHERE p.id=$1 AND p.status='ACTIVE'`,[planId]); if(!plan.rowCount) throw Object.assign(new Error('الخطة غير موجودة أو غير نشطة'),{statusCode:400});
    const p=plan.rows[0]; const parsed=parseManualClientLink(String(b.link));
    if(parsed.protocol!==p.protocol) throw Object.assign(new Error(`الرابط ${parsed.protocol.toUpperCase()} لا يطابق بروتوكول الخطة ${p.protocol.toUpperCase()}`),{statusCode:400});
    if(routerId){
      const rr=await db(`SELECT r.id,r.customer_id,r.lifecycle_status FROM routers r WHERE r.id=$1`,[routerId]);
      if(!rr.rowCount) throw Object.assign(new Error('الراوتر غير موجود'),{statusCode:404});
      if(rr.rows[0].customer_id && rr.rows[0].customer_id!==customerId) throw Object.assign(new Error('الراوتر مرتبط بعميل آخر'),{statusCode:409});
      if(['DECOMMISSIONED','REPLACED'].includes(rr.rows[0].lifecycle_status)) throw Object.assign(new Error('الراوتر غير صالح للربط'),{statusCode:400});
      const live=await db(`SELECT id FROM services WHERE router_id=$1 AND status IN('PROVISIONING','ACTIVE','SUSPENDED')`,[routerId]);
      if(live.rowCount) throw Object.assign(new Error('الراوتر مرتبط بخدمة أخرى بالفعل'),{statusCode:409});
      if(!rr.rows[0].customer_id) await db(`UPDATE routers SET customer_id=$1,lifecycle_status=CASE WHEN lifecycle_status='IN_STOCK' THEN 'ASSIGNED' ELSE lifecycle_status END,updated_at=now() WHERE id=$2`,[customerId,routerId]);
    }
    const client=await pool.connect();
    try{
      await client.query('BEGIN');
      const service=(await client.query(`INSERT INTO services(customer_id,category_id,plan_id,router_id,label,status,provisioning_mode) VALUES($1,$2,$3,$4,$5,'ACTIVE','MANUAL') RETURNING id,public_code`,[customerId,p.category_id,p.id,routerId,labelText||p.category_name+' - '+p.name])).rows[0];
      const end=new Date(Date.now()+Number(p.duration_days)*86400000);
      const sub=(await client.query(`INSERT INTO subscriptions(service_id,plan_id,status,starts_at,current_period_end,quota_bytes) VALUES($1,$2,'ACTIVE',now(),$3,$4) RETURNING id`,[service.id,p.id,end,p.quota_bytes])).rows[0];
      await client.query(`INSERT INTO configs(service_id,version,status,protocol,transport,security,client_credential_enc,credential_key_id,params,manual_link_enc) VALUES($1,1,'CURRENT',$2,$3,$4,$5,'env-v1',$6,$7)`,[service.id,parsed.protocol,parsed.transport,parsed.security,encryptSecret(parsed.uuid),'env-v1',JSON.stringify({...parsed.params,address:parsed.address,port:parsed.port}),encryptSecret(String(b.link).trim())]);
      await audit(client,req,'service.manual_created','services',service.id,{mode:'MANUAL',protocol:parsed.protocol,routerId},customerId);
      await client.query('COMMIT');
      return {id:service.id,public_code:service.public_code,subscriptionId:sub.id};
    }catch(e){await client.query('ROLLBACK');throw e}finally{client.release()}
  });
'''
          if "admin.post('/services/manual'" not in a:
              a = a.replace(service_marker, manual_route + service_marker)

          # Router creation can optionally assign a customer.
          old_router = "INSERT INTO routers(serial_number,device_identifier,model,hardware_revision,openwrt_version,firmware_version,lifecycle_status) VALUES($1,$2,$3,$4,$5,$6,'IN_STOCK') RETURNING *"
          new_router = "INSERT INTO routers(serial_number,device_identifier,model,hardware_revision,openwrt_version,firmware_version,customer_id,lifecycle_status) VALUES($1,$2,$3,$4,$5,$6,$7,CASE WHEN $7 IS NULL THEN 'IN_STOCK' ELSE 'ASSIGNED' END) RETURNING *"
          if old_router in a:
              a = a.replace(old_router,new_router)
              a = a.replace("[b.serialNumber,b.deviceIdentifier||null,b.model,b.hardwareRevision||null,b.openwrtVersion||null,b.firmwareVersion||null])).rows[0]; });", "[b.serialNumber,b.deviceIdentifier||null,b.model,b.hardwareRevision||null,b.openwrtVersion||null,b.firmwareVersion||null,b.customerId||null])).rows[0]; });", 1)

          # Customer config: return encrypted original manual link directly; managed services keep existing generated-link logic.
          old_config = "customer.get('/services/:id/config', async (req:any) => { const r=await db(`SELECT s.id,s.router_id,c.link_visibility,cfg.protocol,cfg.transport,cfg.security,cfg.client_credential_enc,cfg.params,e.port,h.address FROM services s JOIN config_categories c ON c.id=s.category_id JOIN configs cfg ON cfg.service_id=s.id AND cfg.status='CURRENT' JOIN service_allocations a ON a.service_id=s.id AND a.status='ACTIVE' JOIN server_endpoints e ON e.id=a.endpoint_id JOIN hosts h ON h.id=e.host_id WHERE s.id=$1 AND s.customer_id=$2`,[req.params.id,req.principal!.id]);if(!r.rowCount)throw Object.assign(new Error('Config غير متاح'),{statusCode:404});const row=r.rows[0];if(row.link_visibility==='NEVER'||(row.link_visibility==='STANDALONE_ONLY'&&row.router_id))throw Object.assign(new Error('الرابط غير متاح لهذه الخدمة'),{statusCode:403});const uuid=decryptSecret(row.client_credential_enc);let link='';if(row.protocol==='vless'){const q=new URLSearchParams();if(row.transport)q.set('type',row.transport);if(row.security)q.set('security',row.security);for(const k of ['sni','path','host','flow'])if(row.params?.[k])q.set(k,row.params[k]);link=`vless://${encodeURIComponent(uuid)}@${row.address}:${row.port}?${q.toString()}#CowboyBebop`;}else{const payload=Buffer.from(JSON.stringify({v:2,ps:'CowboyBebop',add:row.address,port:String(row.port),id:uuid,aid:0,net:row.transport||'tcp',type:'none',host:row.params?.host||'',path:row.params?.path||'',tls:row.security==='tls'?'tls':''})).toString('base64');link=`vmess://${payload}`;}const c=await pool.connect();try{await audit(c,req,'secret.revealed','configs',null,{serviceId:req.params.id},req.principal!.id);}finally{c.release();}return {link}; });"
          new_config = r'''customer.get('/services/:id/config', async (req:any) => {
    const r=await db(`SELECT s.id,s.router_id,c.link_visibility,cfg.protocol,cfg.transport,cfg.security,cfg.client_credential_enc,cfg.params,cfg.manual_link_enc FROM services s JOIN config_categories c ON c.id=s.category_id JOIN configs cfg ON cfg.service_id=s.id AND cfg.status='CURRENT' WHERE s.id=$1 AND s.customer_id=$2`,[req.params.id,req.principal!.id]);
    if(!r.rowCount) throw Object.assign(new Error('Config غير متاح'),{statusCode:404});
    const row=r.rows[0];
    if(row.link_visibility==='NEVER'||(row.link_visibility==='STANDALONE_ONLY'&&row.router_id)) throw Object.assign(new Error('الرابط غير متاح لهذه الخدمة'),{statusCode:403});
    let link='';
    if(row.manual_link_enc){ link=decryptSecret(row.manual_link_enc); }
    else {
      const alloc=await db(`SELECT e.port,h.address FROM service_allocations a JOIN server_endpoints e ON e.id=a.endpoint_id JOIN hosts h ON h.id=e.host_id WHERE a.service_id=$1 AND a.status='ACTIVE'`,[req.params.id]);
      if(!alloc.rowCount) throw Object.assign(new Error('Config غير متاح'),{statusCode:404});
      const uuid=decryptSecret(row.client_credential_enc), address=alloc.rows[0].address, port=alloc.rows[0].port;
      if(row.protocol==='vless'){const q=new URLSearchParams();if(row.transport)q.set('type',row.transport);if(row.security)q.set('security',row.security);for(const k of ['sni','path','host','flow'])if(row.params?.[k])q.set(k,row.params[k]);link=`vless://${encodeURIComponent(uuid)}@${address}:${port}?${q.toString()}#CowboyBebop`;}
      else{const payload=Buffer.from(JSON.stringify({v:2,ps:'CowboyBebop',add:address,port:String(port),id:uuid,aid:0,net:row.transport||'tcp',type:'none',host:row.params?.host||'',path:row.params?.path||'',tls:row.security==='tls'?'tls':''})).toString('base64');link=`vmess://${payload}`;}
    }
    const c=await pool.connect();try{await audit(c,req,'secret.revealed','configs',null,{serviceId:req.params.id},req.principal!.id);}finally{c.release();}return {link};
  });'''
          if old_config in a:
              a = a.replace(old_config,new_config)
          else:
              raise SystemExit('customer config route not found')

          api.write_text(a)

          # 4) Worker: manual services must never call Marzban; also use encrypted provider credentials.
          worker = root/'apps/api/src/worker.ts'
          w = worker.read_text()
          w = w.replace(
              "const row=(await pool.query(`SELECT s.id,s.public_code,s.status,p.duration_days,p.quota_bytes,sub.id subscription_id,sub.current_period_end,sub.status subscription_status,a.id allocation_id,a.status allocation_status,e.port,e.protocol,e.provider_inbound_tag,e.public_params,h.address,pa.id proxy_account_id,pa.external_username,pi.base_url FROM services s JOIN config_plans p ON p.id=s.plan_id JOIN subscriptions sub ON sub.service_id=s.id JOIN service_allocations a ON a.service_id=s.id AND a.status IN ('RESERVED','PROVISIONING','ACTIVE') JOIN server_endpoints e ON e.id=a.endpoint_id JOIN hosts h ON h.id=e.host_id JOIN proxy_accounts pa ON pa.service_id=s.id AND pa.status<>'DELETED' JOIN provider_instances pi ON pi.id=pa.provider_instance_id WHERE s.id=$1 ORDER BY a.created_at DESC LIMIT 1`,[job.subject_id])).rows[0];if(!row||row.status==='TERMINATED')return;",
              "const row=(await pool.query(`SELECT s.id,s.public_code,s.status,s.provisioning_mode,p.duration_days,p.quota_bytes,sub.id subscription_id,sub.current_period_end,sub.status subscription_status,a.id allocation_id,a.status allocation_status,e.port,e.protocol,e.provider_inbound_tag,e.public_params,h.address,pa.id proxy_account_id,pa.external_username,pi.base_url,pi.credentials_enc FROM services s JOIN config_plans p ON p.id=s.plan_id JOIN subscriptions sub ON sub.service_id=s.id LEFT JOIN service_allocations a ON a.service_id=s.id AND a.status IN ('RESERVED','PROVISIONING','ACTIVE') LEFT JOIN server_endpoints e ON e.id=a.endpoint_id LEFT JOIN hosts h ON h.id=e.host_id LEFT JOIN proxy_accounts pa ON pa.service_id=s.id AND pa.status<>'DELETED' LEFT JOIN provider_instances pi ON pi.id=pa.provider_instance_id WHERE s.id=$1 ORDER BY a.created_at DESC LIMIT 1`,[job.subject_id])).rows[0];if(!row||row.status==='TERMINATED')return;if(row.provisioning_mode==='MANUAL')return;"
          )
          w = w.replace(
              "const provider=new MarzbanProvider(row.base_url,process.env.MARZBAN_USERNAME||'',process.env.MARZBAN_PASSWORD||'');",
              "if(!row.base_url||!row.credentials_enc) throw new Error('MARZBAN_PROVIDER_CREDENTIALS_MISSING'); const creds=JSON.parse(decrypt(row.credentials_enc)); const provider=new MarzbanProvider(row.base_url,creds.username,creds.password);"
          )
          w = w.replace(
              "async function renewService(job:any){const base=(await pool.query(`SELECT oi.id,oi.target_service_id,p.duration_days,p.quota_bytes,sub.id subscription_id,sub.current_period_end,pa.external_username,pi.base_url,cfg.protocol,cfg.params,cfg.client_credential_enc,e.provider_inbound_tag FROM order_items oi JOIN config_plans p ON p.id=oi.plan_id JOIN subscriptions sub ON sub.service_id=oi.target_service_id JOIN proxy_accounts pa ON pa.service_id=oi.target_service_id JOIN provider_instances pi ON pi.id=pa.provider_instance_id JOIN configs cfg ON cfg.service_id=oi.target_service_id AND cfg.status='CURRENT' JOIN service_allocations a ON a.service_id=oi.target_service_id AND a.status='ACTIVE' JOIN server_endpoints e ON e.id=a.endpoint_id WHERE oi.id=$1`,[job.subject_id])).rows[0];if(!base)return;",
              "async function renewService(job:any){const base=(await pool.query(`SELECT oi.id,oi.target_service_id,s.provisioning_mode,p.duration_days,p.quota_bytes,sub.id subscription_id,sub.current_period_end,pa.external_username,pi.base_url,pi.credentials_enc,cfg.protocol,cfg.params,cfg.client_credential_enc,e.provider_inbound_tag FROM order_items oi JOIN services s ON s.id=oi.target_service_id JOIN config_plans p ON p.id=oi.plan_id JOIN subscriptions sub ON sub.service_id=oi.target_service_id LEFT JOIN proxy_accounts pa ON pa.service_id=oi.target_service_id AND pa.status<>'DELETED' LEFT JOIN provider_instances pi ON pi.id=pa.provider_instance_id LEFT JOIN configs cfg ON cfg.service_id=oi.target_service_id AND cfg.status='CURRENT' LEFT JOIN service_allocations a ON a.service_id=oi.target_service_id AND a.status='ACTIVE' LEFT JOIN server_endpoints e ON e.id=a.endpoint_id WHERE oi.id=$1`,[job.subject_id])).rows[0];if(!base)return;"
          )
          old_renew_tail = "await pool.query(`UPDATE subscriptions SET status='ACTIVE',current_period_end=$1,quota_bytes=$2,grace_until=NULL,updated_at=now() WHERE id=$3`,[end,base.quota_bytes,base.subscription_id]);await new MarzbanProvider(base.base_url,process.env.MARZBAN_USERNAME||'',process.env.MARZBAN_PASSWORD||'').createOrUpdate({username:base.external_username,uuid:decrypt(base.client_credential_enc),inbound:base.provider_inbound_tag,expireAt:end,quotaBytes:base.quota_bytes,protocol:base.protocol,flow:base.params?.flow});await pool.query(`UPDATE order_items SET fulfillment_status='FULFILLED',fulfilled_at=now() WHERE id=$1`,[base.id]);}"
          new_renew_tail = "await pool.query(`UPDATE subscriptions SET status='ACTIVE',current_period_end=$1,quota_bytes=$2,grace_until=NULL,updated_at=now() WHERE id=$3`,[end,base.quota_bytes,base.subscription_id]);if(base.provisioning_mode!=='MANUAL'){if(!base.base_url||!base.credentials_enc) throw new Error('MARZBAN_PROVIDER_CREDENTIALS_MISSING');const creds=JSON.parse(decrypt(base.credentials_enc));await new MarzbanProvider(base.base_url,creds.username,creds.password).createOrUpdate({username:base.external_username,uuid:decrypt(base.client_credential_enc),inbound:base.provider_inbound_tag,expireAt:end,quotaBytes:base.quota_bytes,protocol:base.protocol,flow:base.params?.flow});}await pool.query(`UPDATE order_items SET fulfillment_status='FULFILLED',fulfilled_at=now() WHERE id=$1`,[base.id]);}"
          if old_renew_tail in w:
              w=w.replace(old_renew_tail,new_renew_tail)
          # Make service actions safe for manual services and use provider credentials from DB.
          old_action = "const row=(await pool.query(`SELECT s.id,s.status,pa.external_username,pi.base_url FROM services s JOIN proxy_accounts pa ON pa.service_id=s.id AND pa.status='ACTIVE' JOIN provider_instances pi ON pi.id=pa.provider_instance_id WHERE s.id=$1`,[job.subject_id])).rows[0];if(!row)return;const provider=new MarzbanProvider(row.base_url,process.env.MARZBAN_USERNAME||'',process.env.MARZBAN_PASSWORD||'');"
          new_action = "const row=(await pool.query(`SELECT s.id,s.status,s.provisioning_mode,pa.external_username,pi.base_url,pi.credentials_enc FROM services s LEFT JOIN proxy_accounts pa ON pa.service_id=s.id AND pa.status='ACTIVE' LEFT JOIN provider_instances pi ON pi.id=pa.provider_instance_id WHERE s.id=$1`,[job.subject_id])).rows[0];if(!row)return;if(row.provisioning_mode==='MANUAL')return;if(!row.base_url||!row.credentials_enc||!row.external_username)throw new Error('MARZBAN_PROVIDER_CREDENTIALS_MISSING');const creds=JSON.parse(decrypt(row.credentials_enc));const provider=new MarzbanProvider(row.base_url,creds.username,creds.password);"
          if old_action in w:
              w=w.replace(old_action,new_action)
          worker.write_text(w)

          # 5) Web UI: catalog CRUD, manual service creation, router customer assignment.
          web = root/'apps/web/src/app.tsx'
          x = web.read_text()

          old_catalog = re.search(r"function CatalogPage\(\).*?\nfunction SettingsPage", x, re.S)
          if not old_catalog:
              raise SystemExit('CatalogPage block not found')
