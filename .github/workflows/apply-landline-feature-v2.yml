name: Apply landline feature v2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-landlines-v2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source changes
        run: |
          node <<'NODE'
          const fs=require('fs');
          const wf=fs.readFileSync('.github/workflows/apply-landline-feature.yml','utf8');
          const start=wf.indexOf('          cat > /tmp/apply-landline-feature.mjs <<\'NODE\'\n');
          if(start<0) throw new Error('embedded transformer not found');
          const bodyStart=start+'          cat > /tmp/apply-landline-feature.mjs <<\'NODE\'\n'.length;
          const end=wf.indexOf('          NODE\n',bodyStart);
          if(end<0) throw new Error('embedded transformer end not found');
          let script=wf.slice(bodyStart,end).split('\n').map(x=>x.startsWith('          ')?x.slice(10):x).join('\n');
          const old="\"cfg.public_code config_code,r.public_code router_code,h.city,h.country,se.public_code endpoint_code\"";
          const replacement="\"r.public_code router_code,cfg.id config_id,cfg.public_code config_code,h.city,h.country,se.public_code endpoint_code\"";
          const oldTo="\"cfg.public_code config_code,r.public_code router_code,cl.number landline_number,cl.label landline_label,h.city,h.country,se.public_code endpoint_code\"";
          const replacementTo="\"r.public_code router_code,cl.number landline_number,cl.label landline_label,cfg.id config_id,cfg.public_code config_code,h.city,h.country,se.public_code endpoint_code\"";
          if(!script.includes(old)||!script.includes(oldTo)) throw new Error('admin service markers not found in transformer');
          script=script.replace(old,replacement).replace(oldTo,replacementTo);
          fs.writeFileSync('/tmp/apply-landline-feature-v2.mjs',script);
          NODE
          node /tmp/apply-landline-feature-v2.mjs
      - name: Validate
        run: |
          git diff --check
          npm install --ignore-scripts
          npm run typecheck
      - name: Commit final changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-landline-feature.yml .github/workflows/apply-landline-feature-v2.yml
          git add apps/api/src/main.ts apps/api/src/worker-v2.ts apps/web/src/app.tsx db/schema.sql db/migrations/20261018_customer_landlines.sql .github/workflows/apply-landline-feature.yml .github/workflows/apply-landline-feature-v2.yml
          git diff --cached --quiet && { echo "No changes to commit"; exit 0; }
          git commit -m "feat: support customer landline numbers for config orders"
          git push origin main
