services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cowboybepob
      POSTGRES_USER: cowboybepob
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowboybepob -d cowboybepob"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    environment:
      PORT: 4000
      DATABASE_URL: postgres://cowboybepob:${POSTGRES_PASSWORD:-local_dev_only}@db:5432/cowboybepob
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
